<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Node & Line Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cyan to Purple Gradient for Connections -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Wi-Fi Wave Gradient -->
    <linearGradient id="wifiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Outer Shell (macOS Style App Icon Radius) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="98" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2"/>

  <!-- Wi-Fi Signal Waves (Background/Header element) -->
  <g stroke="url(#wifiGrad)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.35">
    <path d="M 176 160 A 120 120 0 0 1 336 160" />
    <path d="M 208 196 A 72 72 0 0 1 304 196" />
  </g>

  <!-- P2P Mesh Network Connections -->
  <g stroke="url(#cyanPurple)" stroke-width="6" opacity="0.85" filter="url(#glow)">
    <!-- Central Node to Outer Nodes -->
    <line x1="256" y1="256" x2="160" y2="200" />
    <line x1="256" y1="256" x2="352" y2="200" />
    <line x1="256" y1="256" x2="140" y2="320" />
    <line x1="256" y1="256" x2="372" y2="320" />
    <line x1="256" y1="256" x2="256" y2="380" />

    <!-- Peer-to-Peer Interconnections -->
    <line x1="160" y1="200" x2="352" y2="200" stroke-dasharray="8 6" />
    <line x1="160" y1="200" x2="140" y2="320" />
    <line x1="352" y1="200" x2="372" y2="320" />
    <line x1="140" y1="320" x2="256" y2="380" />
    <line x1="372" y1="320" x2="256" y2="380" />
  </g>

  <!-- P2P Nodes (Circles) -->
  <g filter="url(#glow)">
    <!-- Outer Nodes -->
    <circle cx="160" cy="200" r="14" fill="#38bdf8" />
    <circle cx="352" cy="200" r="14" fill="#818cf8" />
    <circle cx="140" cy="320" r="14" fill="#38bdf8" />
    <circle cx="372" cy="320" r="14" fill="#c084fc" />
    <circle cx="256" cy="380" r="14" fill="#a855f7" />

    <!-- Center Host Node -->
    <circle cx="256" cy="256" r="22" fill="#38bdf8" stroke="#ffffff" stroke-width="4"/>
    <circle cx="256" cy="256" r="8" fill="#ffffff" />
  </g>
</svg>
