name: Room Connectivity
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: room-connectivity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firewall:
    name: Room ICMP firewall (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exercise production firewall rule template (PowerShell 7)
        shell: pwsh
        run: ./scripts/room-connectivity/windows-firewall.ps1
      - name: Exercise production firewall rule template (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/room-connectivity/windows-firewall.ps1
  regression:
    name: Room data and identity regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Room production data-path tests
        run: cargo test --locked -p p2wlan-daemon --lib room_ -- --test-threads=1
      - name: Firewall script generation contract
        run: cargo test --locked -p p2wlan-daemon --lib firewall_contract_tests -- --test-threads=1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Room UI, identity and diagnostics tests
        working-directory: apps/flutter_client
        run: |
          flutter pub get
          flutter test test/room_connectivity_test.dart test/room_dataplane_test.dart test/rooms_page_test.dart
