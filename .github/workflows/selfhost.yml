name: Self-hosted Server
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/selfhost/**'
      - 'scripts/selfhost/**'
      - 'scripts/p2wlan-server'
      - 'scripts/install-server.sh'
      - 'scripts/install-server-docker.sh'
      - 'scripts/bootstrap-server.sh'
      - 'scripts/deploy-server.sh'
      - 'docs/guides/self-hosting.md'
      - '.github/workflows/selfhost.yml'
      - '.github/workflows/build-server.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/selfhost/**'
      - 'scripts/selfhost/**'
      - 'scripts/p2wlan-server'
      - 'scripts/install-server.sh'
      - 'scripts/install-server-docker.sh'
      - 'scripts/bootstrap-server.sh'
      - 'scripts/deploy-server.sh'
      - '.github/workflows/selfhost.yml'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A commit validation (push / pull_request) and a periodic health check
  # (schedule / workflow_dispatch) are different obligations for the same
  # ref. Sharing one concurrency group let a scheduled run cancel an
  # in-flight commit validation, so each event class gets its own group and
  # only a pull request cancels its own superseded predecessors.
  group: selfhost-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    name: Native selfhost (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record exact source
        shell: bash
        run: git rev-parse HEAD HEAD^{tree}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Vet and full server tests
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          go vet ./...
          if [ "$RUNNER_OS" = Linux ]; then
            go test -race ./... -count=1
          else
            go test ./... -count=1
          fi
      - name: Build real native binaries and run authenticated two-process smoke
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          suffix=
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          mkdir -p "$RUNNER_TEMP/selfhost-bin"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/selfhost-bin/p2wlan-control$suffix" .
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/selfhost-bin/p2wlan-relay$suffix" ./relay
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/selfhost-bin/p2wlan-config$suffix" ./cmd/p2wlan-config
          go run ../scripts/selfhost/smoke.go --bin-dir "$RUNNER_TEMP/selfhost-bin"
      - name: Verify advertised IPv6 loopback with real TLS peers and revocation
        shell: bash
        working-directory: server
        run: go run ../scripts/selfhost/smoke.go --bin-dir "$RUNNER_TEMP/selfhost-bin" --relay-host ::1
      - name: Manager and source contracts
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/bootstrap-server.sh scripts/install-server.sh scripts/install-server-docker.sh scripts/deploy-server.sh scripts/p2wlan-server
          python3 -m unittest discover -s scripts/selfhost -p 'test_*.py'
  docker:
    name: Docker selfhost and static server compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Generate private loopback-only test deployment
        run: |
          set -euo pipefail
          (cd server && go run ./cmd/p2wlan-config --mode docker --output ../deploy/selfhost/config --dev-localhost)
      - name: Verify IPv4 and IPv6 Compose publication without exposing environment values
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          for host in ('127.0.0.1', '127.0.0.2', '::1'):
              env = dict(os.environ, RELAY_PUBLISH_HOST=host, RELAY_PORT='18081', CONTROL_PORT='18080')
              result = subprocess.run(['docker', 'compose', '--env-file', 'deploy/selfhost/config/compose.env', '-f', 'deploy/selfhost/compose.yml', 'config', '--format', 'json'], env=env, check=True, capture_output=True, text=True)
              services = json.loads(result.stdout)['services']
              ports = services['relay']['ports']
              assert len(ports) == 1 and ports[0]['host_ip'] == host
              assert ports[0]['target'] == 18081 and str(ports[0]['published']) == '18081'
              assert ports[0]['protocol'] == 'tcp'
              assert services['control']['ports'][0]['host_ip'] == '127.0.0.1'
              print('PASS: Compose publication host=' + host + '; control remains loopback-only')
          PY
      - name: Build actual image and start documented Compose topology
        run: |
          set -euo pipefail
          docker compose --env-file deploy/selfhost/config/compose.env -f deploy/selfhost/compose.yml config --quiet
          docker compose --env-file deploy/selfhost/config/compose.env -f deploy/selfhost/compose.yml up -d --build --wait --wait-timeout 90
          docker compose --env-file deploy/selfhost/config/compose.env -f deploy/selfhost/compose.yml exec -T relay curl -fsS --max-time 5 http://127.0.0.1:18082/readyz
      - name: Non-root private support logs and SQLite survive a container restart
        run: python3 scripts/selfhost/test_compose_persistence.py
      - name: Stop source-build fixture before Docker installer regression
        run: docker compose --env-file deploy/selfhost/config/compose.env -f deploy/selfhost/compose.yml down --remove-orphans
      - name: Deploy and repeat the Docker installer with the exact local image
        run: |
          set -euo pipefail
          image_id=$(docker image inspect p2wlan-selfhost:local --format '{{.Id}}')
          deployment="$RUNNER_TEMP/selfhost-installer"
          sudo bash scripts/install-server-docker.sh --local-image "$image_id" \
            --dev-localhost --dir "$deployment" --non-interactive --wait-timeout 90
          sudo docker compose --env-file "$deployment/.env" -f "$deployment/compose.yml" \
            exec -T relay curl -fsS --max-time 5 http://127.0.0.1:18082/readyz
          DEPLOYMENT_DIR="$deployment" TEST_IMAGE_ID="$image_id" python3 - <<'PY'
          import hashlib, json, os, pathlib, secrets, subprocess, urllib.request
          directory = pathlib.Path(os.environ['DEPLOYMENT_DIR'])
          paths = [directory / 'config' / name for name in ('control.env', 'relay.env', 'tls.key')]
          def fingerprint():
              return [hashlib.sha256(subprocess.check_output(['sudo', 'cat', str(path)])).hexdigest() for path in paths]
          original = fingerprint()
          account = {'email': 'installer-' + secrets.token_hex(8) + '@example.test', 'password': secrets.token_hex(24)}
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          def authenticate(path):
              request = urllib.request.Request('http://127.0.0.1:18080/api/v1/' + path,
                  data=json.dumps(account).encode(), headers={'Content-Type': 'application/json'}, method='POST')
              with opener.open(request, timeout=5) as response:
                  result = json.load(response)
              if not isinstance(result.get('token'), str) or not result['token']:
                  raise SystemExit('installer persistence check did not receive authentication proof')
          authenticate('register')
          subprocess.run(['sudo', 'docker', 'compose', '--env-file', str(directory / '.env'),
              '-f', str(directory / 'compose.yml'), 'down'], check=True, timeout=30)
          subprocess.run(['sudo', 'bash', 'scripts/install-server-docker.sh', '--local-image', os.environ['TEST_IMAGE_ID'],
              '--dev-localhost', '--dir', str(directory), '--non-interactive', '--wait-timeout', '90'], check=True, timeout=180)
          if fingerprint() != original:
              raise SystemExit('repeated Docker installation changed existing credentials')
          authenticate('login')
          print('PASS: real Docker installer retained credentials and authenticated database state after redeployment')
          PY
      - name: Verify static ELF and Ubuntu 20.04 server loader compatibility
        working-directory: server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/static-bin"
          for role in control relay; do
            package=.
            if [ "$role" = relay ]; then package=./relay; fi
            CGO_ENABLED=0 go build -o "$RUNNER_TEMP/static-bin/p2wlan-$role" "$package"
            if readelf -l "$RUNNER_TEMP/static-bin/p2wlan-$role" | grep -q INTERP; then
              echo 'unexpected dynamic loader dependency' >&2; exit 1
            fi
            docker run --rm -v "$RUNNER_TEMP/static-bin:/opt/p2wlan:ro" ubuntu:20.04 "/opt/p2wlan/p2wlan-$role" --version
          done
      - name: Always clean test containers
        if: always()
        run: |
          status=0
          docker compose --env-file deploy/selfhost/config/compose.env -f deploy/selfhost/compose.yml down --remove-orphans || status=1
          deployment="$RUNNER_TEMP/selfhost-installer"
          if sudo test -f "$deployment/compose.yml"; then
            sudo docker compose --env-file "$deployment/.env" -f "$deployment/compose.yml" down --remove-orphans || status=1
          fi
          exit "$status"
