name: Apply NAT topology convergence fix

on:
  push:
    branches:
      - test/nat-topology-gate-v4-20260828
    paths:
      - ".github/workflows/apply-nat-topology-convergence-fix.yml"
      - ".github/patches/nat-topology-convergence-fix.patch"

permissions:
  contents: write

concurrency:
  group: apply-nat-topology-convergence-fix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/nat-topology-gate-v4-20260828
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and validate convergence fixes
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/patches/nat-topology-convergence-fix.patch
          git apply .github/patches/nat-topology-convergence-fix.patch
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p p2wlan-daemon --all-targets
          cargo test -p p2wlan-daemon overlay_validation_waits_for_a_confirmed_active_path -- --test-threads=1
          cargo test -p p2wlan-daemon decrypted_direct_endpoint_evidence_requests_validation_without_recursing -- --test-threads=1
          bash scripts/nat-sim/run-ci-topology.sh unit
          git diff --check
      - name: Commit validated fix and remove one-time applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-nat-topology-convergence-fix.yml
          git rm .github/patches/nat-topology-convergence-fix.patch
          git add -A
          git commit -m "fix(nat): converge direct validation and gated overlay traffic"
          git push origin HEAD:test/nat-topology-gate-v4-20260828
