name: Direct-first detached socket regression

on:
  push:
    branches: [feat/direct-first-nat-20260921]
    paths: [.github/workflows/direct-first-detached-regression.yml]

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'yhan-sun/p2wlan' && github.ref == 'refs/heads/feat/direct-first-nat-20260921'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.apply.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Apply exact detached-socket regression
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 0f60eb4fc533552cbdc244c055ac0433e4b6baa4
          test "$(git rev-parse HEAD:client/daemon/src/udp/tests/part04.rs)" = 8bf8a6de093a4624c26371b8bde01a1c768f1738
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('client/daemon/src/udp/tests/part04.rs')
          text = p.read_text()
          start = text.index('async fn hard_hard_detached_exact_socket_sweep_fails_closed_without_pool_sends() {')
          end = text.index('\n#[tokio::test]', start)
          original = text[start:end]
          block = original
          old = '    let (peers, transport, _nat) = generation_env().await;'
          assert block.count(old) == 1
          block = block.replace(old, old + '''
              let generation = peers.current_network_generation().await;
              assert!(peers
                  .confirm_relay_peer("peer-b", "tcp://relay.test:18081", generation)
                  .await);
          ''')
          old = '''    assert_eq!(
                  peers.select_path_for_data("peer-b", true, true).await.path,
                  Some(NetworkPath::Relay),
                  "a detached exact Hard↔Hard socket must leave Relay as the data path"
              );'''
          assert block.count(old) == 1
          block = block.replace(old, '''    assert_eq!(
                  peers.select_path_for_data("peer-b", true, true).await.path,
                  None,
                  "losing a speculative socket cannot bypass the first Direct window"
              );
              timeout(Duration::from_secs(8), async {
                  loop {
                      let selection = peers.select_path_for_data("peer-b", true, true).await;
                      assert_ne!(selection.path, Some(NetworkPath::Direct));
                      if selection.path == Some(NetworkPath::Relay) {
                          break;
                      }
                      sleep(Duration::from_millis(20)).await;
                  }
              })
              .await
              .expect("confirmed Relay must become usable after the bounded Direct window");
              assert!(!peers.is_direct("peer-b").await);
              assert_eq!(transport.dynamic_socket_count().await, 0);''')
          assert block != original
          p.write_text(text[:start] + block + text[end:])
          pathlib.Path('.github/workflows/direct-first-detached-regression.yml').unlink()
          PY
          rustfmt --edition 2021 --config skip_children=true client/daemon/src/udp/tests/part04.rs
          git diff --check
          git add -- client/daemon/src/udp/tests/part04.rs .github/workflows/direct-first-detached-regression.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat:验证失效打洞Socket不抢中继业务且到期正确兜底'
          cat > "$RUNNER_TEMP/p2wlan-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/p2wlan-askpass"
          GIT_ASKPASS="$RUNNER_TEMP/p2wlan-askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/feat/direct-first-nat-20260921
          rm "$RUNNER_TEMP/p2wlan-askpass"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: apply
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.apply.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Record exact source and compile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/SOURCE_COMMIT
          cargo test --locked -p p2wlan-daemon --lib --no-run --message-format=json > evidence/build.jsonl 2> evidence/build.stderr
      - name: DirectFirst and NAT boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/run_rust_tests.py direct_first --each | tee evidence/direct-first.log
          python3 scripts/quality/run_rust_tests.py relay_availability_does_not_cancel_punch_generation --each | tee evidence/relay-standby.log
          python3 scripts/quality/run_rust_tests.py destination_budget --each | tee evidence/destination-budget.log
          cargo test --locked -p p2pnet-nat | tee evidence/nat.log
          cargo test --locked -p p2wlan-cli | tee evidence/cli.log
      - name: Repository contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo fmt --all --check
            python3 scripts/quality/check_include_format.py
            python3 scripts/docs/verify_repository.py
            python3 scripts/quality/check_code_health.py --base-ref origin/main
            python3 -m unittest discover -s scripts/quality/tests -p 'test_*.py'
            bash -n scripts/install-server.sh scripts/deploy-server.sh scripts/p2wlan-server
            cargo clippy --locked -p p2wlan-daemon -p p2pnet-nat -p p2wlan-cli --all-targets -- -D warnings
          } 2>&1 | tee evidence/contracts.log
      - name: General daemon regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 900 cargo test --locked -p p2wlan-daemon --lib -- --test-threads=1 --skip hard_hard_ | tee evidence/daemon-general.log
      - name: Isolated HardHard regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 900 python3 scripts/quality/run_rust_tests.py hard_hard_ --each | tee evidence/hard-hard.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: direct-first-final-${{ needs.apply.outputs.source_sha }}
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
