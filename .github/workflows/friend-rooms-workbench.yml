name: Friend Rooms Workbench

on:
  push:
    branches: [feat/friend-rooms]

permissions:
  contents: read

concurrency:
  group: friend-rooms-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.6'
          cache-dependency-path: server/go.sum
      - name: Prepare offline compiler and dependency bundles
        run: |
          set -euo pipefail
          mkdir -p /tmp/room-tools
          rustc --version > /tmp/room-tools/versions.txt
          cargo --version >> /tmp/room-tools/versions.txt
          go version >> /tmp/room-tools/versions.txt
          cargo vendor --locked --versioned-dirs /tmp/room-vendor > /tmp/room-tools/cargo-config.toml
          tar -C /tmp -czf /tmp/room-tools/rust-vendor.tar.gz room-vendor
          SYSROOT="$(rustc --print sysroot)"
          tar -C "$SYSROOT" --exclude=share/doc --exclude=share/man -czf /tmp/room-tools/rust-toolchain.tar.gz .
          tar -C "$(go env GOROOT)" --exclude=doc --exclude=test -czf /tmp/room-tools/go-toolchain.tar.gz .
      - name: Upload isolated offline tools
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: friend-rooms-offline-tools-${{ github.sha }}
          path: /tmp/room-tools/
          compression-level: 0
          retention-days: 1
