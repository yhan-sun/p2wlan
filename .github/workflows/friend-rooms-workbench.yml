name: Friend Rooms Workbench

on:
  push:
    branches: [feat/friend-rooms]
    paths:
      - '.github/workflows/friend-rooms-workbench.yml'

permissions:
  contents: read

concurrency:
  group: friend-rooms-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
      - name: Resolve locked application dependencies
        working-directory: apps/flutter_client
        run: flutter pub get --enforce-lockfile
      - name: Prepare offline Flutter test tools
        run: |
          set -euo pipefail
          mkdir -p /tmp/flutter-tools
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          flutter --version > /tmp/flutter-tools/versions.txt
          tar -C "$FLUTTER_ROOT" --exclude=examples --exclude=dev --exclude=.git --exclude=bin/cache/artifacts/engine/android-arm --exclude=bin/cache/artifacts/engine/android-arm-profile --exclude=bin/cache/artifacts/engine/android-arm-release --exclude=bin/cache/artifacts/engine/android-arm64 --exclude=bin/cache/artifacts/engine/android-arm64-profile --exclude=bin/cache/artifacts/engine/android-arm64-release --exclude=bin/cache/artifacts/engine/android-x64 --exclude=bin/cache/artifacts/engine/android-x64-profile --exclude=bin/cache/artifacts/engine/android-x64-release --exclude=bin/cache/artifacts/engine/android-x86 -czf /tmp/flutter-tools/flutter-sdk.tar.gz .
          tar -C "${PUB_CACHE:-$HOME/.pub-cache}" -czf /tmp/flutter-tools/pub-cache.tar.gz .
      - name: Upload test environment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: friend-rooms-flutter-tools-${{ github.sha }}
          path: /tmp/flutter-tools/
          compression-level: 0
          retention-days: 1
