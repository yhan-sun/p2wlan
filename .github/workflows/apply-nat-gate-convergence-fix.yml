name: Apply NAT topology convergence fix

on:
  push:
    branches:
      - test/nat-topology-gate-v4-20260828
    paths:
      - .github/workflows/apply-nat-gate-convergence-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/nat-topology-gate-v4-20260828
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply exact source transformations
        run: python3 .github/scripts/apply_nat_gate_fix.py
      - name: Validate transformed tree
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/nat-sim/nat-sim-smoke.sh
          cargo fmt --all --check
          cargo clippy -p p2wlan-daemon --all-targets --all-features -- -D warnings
          cargo test -p p2wlan-daemon --lib -- --test-threads=1
          python3 scripts/nat-sim/test_nat_sim.py
          git diff --check
      - name: Commit validated source and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-nat-gate-convergence-fix.yml
          git rm .github/scripts/apply_nat_gate_fix.py
          git add client/daemon/src/transport.rs scripts/nat-sim/nat-sim-smoke.sh
          git commit -m "fix(nat): require relay confirmation before Direct business proof"
          git push origin HEAD:test/nat-topology-gate-v4-20260828
