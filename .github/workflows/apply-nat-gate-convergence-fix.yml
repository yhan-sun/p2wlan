name: Apply NAT topology convergence fix

on:
  push:
    branches:
      - test/nat-topology-gate-v4-20260828
    paths:
      - .github/workflows/apply-nat-gate-convergence-fix.yml
      - .github/scripts/apply_nat_gate_fix.py
      - .github/scripts/fix_relay_observation_test.py

permissions:
  contents: write

concurrency:
  group: apply-nat-topology-convergence-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/nat-topology-gate-v4-20260828
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply exact source transformations
        run: |
          python3 .github/scripts/apply_nat_gate_fix.py
          python3 .github/scripts/fix_relay_observation_test.py
      - name: Validate transformed tree
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/nat-sim/nat-sim-smoke.sh
          cargo fmt --all --check
          cargo clippy -p p2wlan-daemon --all-targets --all-features -- -D warnings
          cargo test -p p2wlan-daemon --lib transport::tests::initial_wireguard_confirmation_promotes_matching_probe_binding -- --exact --test-threads=1
          cargo test -p p2wlan-daemon --lib -- --test-threads=1
          python3 scripts/nat-sim/test_nat_sim.py
          git diff --check
      - name: Commit validated source and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-nat-gate-convergence-fix.yml
          git rm .github/scripts/apply_nat_gate_fix.py
          git rm .github/scripts/fix_relay_observation_test.py
          git add client/daemon/src/transport.rs \
                  client/daemon/src/transport/tests.rs \
                  scripts/nat-sim/nat-sim-smoke.sh
          git diff --cached --check
          git commit -m "fix(nat): prove relay-before-direct without synthetic relay business"
          git push origin HEAD:test/nat-topology-gate-v4-20260828
