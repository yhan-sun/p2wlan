name: Direct-first offline build environment

on:
  push:
    branches: [feat/direct-first-nat-20260921]
    paths: [.github/workflows/direct-first-toolchain.yml]

permissions:
  contents: read

jobs:
  environment:
    if: github.repository == 'yhan-sun/p2wlan' && github.ref == 'refs/heads/feat/direct-first-nat-20260921'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Fetch locked Linux dependencies and package public build tools
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          mkdir -p offline-build/toolchain offline-build/cargo
          toolchain_dir="$(dirname "$(dirname "$(rustup which rustc)")")"
          cp -a "$toolchain_dir/bin" "$toolchain_dir/lib" offline-build/toolchain/
          mkdir -p offline-build/cargo/registry
          cp -a "$HOME/.cargo/registry/cache" "$HOME/.cargo/registry/index" offline-build/cargo/registry/
          rustc --version --verbose > offline-build/TOOLCHAIN.txt
          git rev-parse HEAD > offline-build/SOURCE_COMMIT
          tar -I 'zstd -T2 -6' -cf offline-build.tar.zst offline-build
          sha256sum offline-build.tar.zst > offline-build.tar.zst.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-first-offline-build-${{ github.sha }}
          path: |
            offline-build.tar.zst
            offline-build.tar.zst.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
