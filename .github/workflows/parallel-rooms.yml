name: Parallel Rooms

on:
  push:
    branches: [main, feat/parallel-rooms-20260908]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A commit validation (push / pull_request) and a periodic health check
  # (schedule / workflow_dispatch) are different obligations for the same
  # ref. Sharing one concurrency group let a scheduled run cancel an
  # in-flight commit validation, so each event class gets its own group and
  # only a pull request cancels its own superseded predecessors.
  group: parallel-rooms-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lifecycle:
    name: Parallel room lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepared OS probe input plans
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python scripts/dual-end/test_probe_request_plan.py -v
          else
            python3 scripts/dual-end/test_probe_request_plan.py -v
          fi
      - name: Original OS socket write observation controls
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python scripts/dual-end/test_probe_write_facts.py -v
          else
            python3 scripts/dual-end/test_probe_write_facts.py -v
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Resolve dependencies
        working-directory: apps/flutter_client
        run: flutter pub get
      - name: Format check
        working-directory: apps/flutter_client
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        working-directory: apps/flutter_client
        run: flutter analyze
      - name: Parallel lifecycle and native route inventory tests
        working-directory: apps/flutter_client
        run: flutter test test/parallel_rooms_test.dart test/room_route_inventory_test.dart

  linux_live:
    name: Parallel rooms real TUN (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test real-TUN restart evidence gate
        run: python3 scripts/parallel-rooms/test_linux_netns.py
      - name: Test bounded Linux application evidence tools
        run: |
          python3 scripts/dual-end/test_udp_business_probe.py
          python3 scripts/dual-end/test_tcp_business_probe.py
          python3 scripts/parallel-rooms/test_linux_tun_evidence.py
          python3 scripts/parallel-rooms/test_linux_tun_fault.py
          python3 scripts/parallel-rooms/test_linux_tun_stall.py
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install namespace tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping iptables util-linux
          sudo modprobe tun
      - name: Build production daemon and control
        run: |
          cargo build --locked -p p2wlan-daemon
          (cd server && go build -o ../target/debug/p2wlan-control .)
      - name: Real TUN parallel rooms and revocation
        run: |
          mkdir -p "$RUNNER_TEMP/parallel-rooms-debug"
          sudo python3 scripts/parallel-rooms/linux-netns.py \
            --daemon target/debug/p2wlan-daemon \
            --control target/debug/p2wlan-control \
            --head "$(git rev-parse HEAD)" \
            --report "$RUNNER_TEMP/parallel-rooms-evidence.json" \
            --debug-dir "$RUNNER_TEMP/parallel-rooms-debug"
      - name: Real kernel TUN fixed UDP and TCP application requests
        timeout-minutes: 8
        run: |
          sudo --preserve-env=GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT python3 scripts/parallel-rooms/linux_tun_evidence.py \
            --daemon target/debug/p2wlan-daemon \
            --control target/debug/p2wlan-control \
            --head "$(git rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/linux-tun-application"
          sudo --preserve-env=GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT python3 scripts/parallel-rooms/linux_tun_evidence.py \
            --daemon target/debug/p2wlan-daemon \
            --control target/debug/p2wlan-control \
            --head "$(git rev-parse HEAD)" \
            --fault-recovery \
            --output-dir "$RUNNER_TEMP/linux-tun-recovery"
          sudo --preserve-env=GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT python3 scripts/parallel-rooms/linux_tun_evidence.py \
            --daemon target/debug/p2wlan-daemon \
            --control target/debug/p2wlan-control \
            --head "$(git rev-parse HEAD)" \
            --server-stall \
            --output-dir "$RUNNER_TEMP/linux-tun-server-stall"
      - name: Upload non-secret network evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: parallel-rooms-live-${{ github.sha }}
          path: |
            ${{ runner.temp }}/parallel-rooms-evidence.json
            ${{ runner.temp }}/parallel-rooms-debug/
            ${{ runner.temp }}/linux-tun-application/
            ${{ runner.temp }}/linux-tun-recovery/
            ${{ runner.temp }}/linux-tun-server-stall/
          if-no-files-found: error
          retention-days: 7

  required:
    name: Parallel Rooms Required
    if: always()
    needs: [lifecycle, linux_live]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce parallel room contracts
        env:
          LIFECYCLE_RESULT: ${{ needs.lifecycle.result }}
          LINUX_LIVE_RESULT: ${{ needs.linux_live.result }}
        run: |
          test "$LIFECYCLE_RESULT" = success
          test "$LINUX_LIVE_RESULT" = success
