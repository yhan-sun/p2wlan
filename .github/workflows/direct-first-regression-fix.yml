name: Direct-first regression repair

on:
  push:
    branches: [feat/direct-first-nat-20260921]
    paths: [.github/workflows/direct-first-regression-fix.yml]

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'yhan-sun/p2wlan' && github.ref == 'refs/heads/feat/direct-first-nat-20260921'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.apply.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Apply the reviewed exact-source changes
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e0b4689f0ad39317a707ef64c7a2815bebebbb57
          python3 - <<'PY'
          import pathlib, subprocess
          expected = {
              'client/daemon/src/udp/tests/part04.rs': 'cce6e3e0a225327008ad0f2c38b95e6963074999',
              'client/daemon/src/lib/tests/synchronized_punch_e2e/mod.rs': '4054841451c9635320c2aea8acfa56572b88aefd',
              'client/nat/src/adaptive.rs': '89ed4d1f78cf38090c083260a0fd9b3087c9b548',
          }
          for path, blob in expected.items():
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path], text=True).strip()
              assert actual == blob, (path, actual, blob)
          def replace(path, old, new):
              file = pathlib.Path(path)
              text = file.read_text()
              assert text.count(old) == 1, (path, 'expected exactly one replacement')
              file.write_text(text.replace(old, new))
          replace('client/daemon/src/udp/tests/part04.rs', '''async fn relay_availability_does_not_cancel_punch_generation() {
              let (outcome, peers, _transport, _nat, _seen) = run_generation_roundtrip(1, false).await;
              // A relay path is available for the peer.
              peers.set_relay("peer-b", "tcp://relay.test:18081").await;
              assert!(peers.has_relay_safety_net("peer-b").await);
              // The generation still completed instead of being cancelled by the relay.
              assert!(matches!(outcome, FreshMappingOutcome::Accepted(..)));
          }''', '''async fn relay_availability_does_not_cancel_punch_generation() {
              let (peers, transport, nat) = generation_env().await;
              let generation = peers.current_network_generation().await;
              // Prepare Relay BEFORE measuring. The former test prepared it only
              // after the generation had already finished and therefore could not
              // detect Relay availability accidentally cancelling the measurement.
              assert!(peers
                  .confirm_relay_peer("peer-b", "tcp://relay.test:18081", generation)
                  .await);
              assert_eq!(
                  peers.select_path_for_data("peer-b", true, true).await.path,
                  None,
                  "confirmed standby must not preempt the first Direct attempt"
              );
              let outcome = transport
                  .run_fresh_mapping_generation(
                      "peer-b",
                      &nat.observers,
                      Duration::from_millis(500),
                      &[nat.peer_public],
                      Duration::from_millis(10),
                      2,
                      None,
                  )
                  .await;
              let result = accepted_result(outcome).await;
              assert_eq!(
                  transport.dynamic_socket_index_for_peer("peer-b").await,
                  Some(result.socket_index),
                  "Relay readiness must not revoke the successful measured socket"
              );
              assert!(!peers
                  .is_relay_business_admitted_for_generation("peer-b", generation)
                  .await);
          }''')
          replace('client/daemon/src/lib/tests/synchronized_punch_e2e/mod.rs', '''async fn assert_relay_remains_available(harness: &TwoPeerHarness) {
              assert_eq!(
                  harness
                      .peers_a
                      .select_path_for_data(HARD_HARD_B, true, true)
                      .await
                      .path,
                  Some(NetworkPath::Relay)
              );
              assert_eq!(
                  harness
                      .peers_b
                      .select_path_for_data(HARD_HARD_A, true, true)
                      .await
                      .path,
                  Some(NetworkPath::Relay)
              );
          }''', '''async fn assert_relay_remains_available(harness: &TwoPeerHarness) {
              // A failed speculative session is not the DirectFirst connection
              // deadline. Keep the default policy: Relay can already be confirmed
              // while neither side is yet allowed to send business through it.
              // Require eventual fallback on BOTH sides without ever permitting a
              // stale/unauthenticated Direct path to satisfy this assertion.
              timeout(Duration::from_secs(8), async {
                  loop {
                      let a = harness
                          .peers_a
                          .select_path_for_data(HARD_HARD_B, true, true)
                          .await;
                      let b = harness
                          .peers_b
                          .select_path_for_data(HARD_HARD_A, true, true)
                          .await;
                      assert_ne!(a.path, Some(NetworkPath::Direct));
                      assert_ne!(b.path, Some(NetworkPath::Direct));
                      if a.path == Some(NetworkPath::Relay) && b.path == Some(NetworkPath::Relay) {
                          return;
                      }
                      sleep(Duration::from_millis(20)).await;
                  }
              })
              .await
              .expect("both peers must admit confirmed Relay after the bounded DirectFirst window");
          }''')
          replace('client/nat/src/adaptive.rs',
                  '            self.revision_count += 1;',
                  '            self.revision_count = self.revision_count.saturating_add(1);')
          file = pathlib.Path('client/nat/src/adaptive.rs')
          text = file.read_text()
          assert 'mod coverage_regressions' not in text
          file.write_text(text + '''
          #[cfg(test)]
          mod coverage_regressions {
              use super::{StepLearner, DIFF_MODE_WINDOW};

              #[test]
              fn confidence_recovers_as_noise_leaves_the_window() {
                  let mut learner = StepLearner::new();
                  for diff in 1..=DIFF_MODE_WINDOW as i16 {
                      learner.observe_diff(diff);
                  }
                  assert_eq!(learner.confidence(), 1.0 / DIFF_MODE_WINDOW as f64);
                  for _ in 0..DIFF_MODE_WINDOW {
                      learner.observe_diff(-3);
                  }
                  assert_eq!(learner.confidence(), 1.0);
              }

              #[test]
              fn advertisements_do_not_inflate_observed_coverage() {
                  let mut learner = StepLearner::new();
                  learner.observe_diff(3);
                  learner.observe_diff(4);
                  learner.observe_advertised(-5);
                  assert_eq!(learner.confidence(), 0.5);
                  learner.observe_diff(0);
                  assert_eq!(learner.confidence(), 0.5);
              }

              #[test]
              fn revision_count_saturates_instead_of_overflowing() {
                  let mut learner = StepLearner::new();
                  learner.revision_count = u32::MAX;
                  learner.observe_diff(3);
                  assert_eq!(learner.estimate(), Some(3));
                  assert_eq!(learner.revision_count(), u32::MAX);
              }
          }
          ''')
          for path in expected:
              subprocess.run(['rustfmt', '--edition', '2021', '--config', 'skip_children=true', path], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          # This one-shot build helper is deliberately absent from the final
          # product tree. No existing workflow, approval or test gate is changed.
          pathlib.Path('.github/workflows/direct-first-regression-fix.yml').unlink()
          subprocess.run(['git', 'add', '--', *expected, '.github/workflows/direct-first-regression-fix.yml'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat:补齐直连保护期下的中继回归与学习计数边界'
          cat > "$RUNNER_TEMP/p2wlan-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/p2wlan-askpass"
          GIT_ASKPASS="$RUNNER_TEMP/p2wlan-askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/feat/direct-first-nat-20260921
          rm "$RUNNER_TEMP/p2wlan-askpass"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: apply
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.apply.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Record exact source and compile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/SOURCE_COMMIT
          cargo test --locked -p p2wlan-daemon --lib --no-run --message-format=json > evidence/build.jsonl 2> evidence/build.stderr
      - name: DirectFirst and NAT boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/run_rust_tests.py direct_first --each | tee evidence/direct-first.log
          python3 scripts/quality/run_rust_tests.py relay_availability_does_not_cancel_punch_generation --each | tee evidence/relay-standby.log
          python3 scripts/quality/run_rust_tests.py destination_budget --each | tee evidence/destination-budget.log
          cargo test --locked -p p2pnet-nat | tee evidence/nat.log
          cargo test --locked -p p2wlan-cli | tee evidence/cli.log
      - name: Repository contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo fmt --all --check
            python3 scripts/quality/check_include_format.py
            python3 scripts/docs/verify_repository.py
            python3 scripts/quality/check_code_health.py --base-ref origin/main
            python3 -m unittest discover -s scripts/quality/tests -p 'test_*.py'
            bash -n scripts/install-server.sh scripts/deploy-server.sh scripts/p2wlan-server
            cargo clippy --locked -p p2wlan-daemon -p p2pnet-nat -p p2wlan-cli --all-targets -- -D warnings
          } 2>&1 | tee evidence/contracts.log
      - name: General daemon regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 900 cargo test --locked -p p2wlan-daemon --lib -- --test-threads=1 --skip hard_hard_ | tee evidence/daemon-general.log
      - name: Isolated HardHard regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 900 python3 scripts/quality/run_rust_tests.py hard_hard_ --each | tee evidence/hard-hard.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: direct-first-regression-${{ needs.apply.outputs.source_sha }}
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
