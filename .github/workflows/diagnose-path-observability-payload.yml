name: Diagnose Path Observability Payload

on:
  push:
    branches:
      - feat/path-observability-20260902
    paths:
      - ".p2wlan-task/path-observability-payload/DIAGNOSE"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/path-observability-20260902
          fetch-depth: 0

      - name: Inspect payload without early exit
        shell: bash
        run: |
          set +e
          root=.p2wlan-task/path-observability-payload
          report=/tmp/path-observability-payload-report.txt
          payload_b64=/tmp/path-observability.patch.xz.b64
          payload_xz=/tmp/path-observability.patch.xz
          patch=/tmp/path-observability.patch
          : > "$report"
          {
            echo "head=$(git rev-parse HEAD)"
            echo "branch=$(git branch --show-current)"
            echo "part_count=$(find "$root" -maxdepth 1 -type f -name 'part-*' | wc -l)"
            echo "-- parts --"
            for file in "$root"/part-*; do
              printf '%s bytes=' "$file"
              wc -c < "$file"
              git ls-files -s "$file"
              sha256sum "$file"
            done
            echo "-- assemble --"
          } >> "$report" 2>&1

          cat "$root"/part-* > "$payload_b64" 2>/tmp/cat.err
          cat_status=$?
          {
            echo "cat_status=$cat_status"
            echo "b64_size=$(wc -c < "$payload_b64" 2>/dev/null)"
            sha256sum "$payload_b64" 2>&1
            cat /tmp/cat.err
          } >> "$report"

          base64 --decode "$payload_b64" > "$payload_xz" 2>/tmp/base64.err
          base64_status=$?
          {
            echo "base64_status=$base64_status"
            echo "xz_size=$(wc -c < "$payload_xz" 2>/dev/null)"
            sha256sum "$payload_xz" 2>&1
            cat /tmp/base64.err
          } >> "$report"

          xz --test "$payload_xz" 2>/tmp/xz-test.err
          xz_test_status=$?
          xz --decompress --stdout "$payload_xz" > "$patch" 2>/tmp/xz-decode.err
          xz_decode_status=$?
          {
            echo "xz_test_status=$xz_test_status"
            cat /tmp/xz-test.err
            echo "xz_decode_status=$xz_decode_status"
            echo "patch_size=$(wc -c < "$patch" 2>/dev/null)"
            sha256sum "$patch" 2>&1
            cat /tmp/xz-decode.err
          } >> "$report"

          git apply --unidiff-zero --check "$patch" 2>/tmp/git-apply.err
          apply_status=$?
          {
            echo "git_apply_status=$apply_status"
            cat /tmp/git-apply.err
            echo "expected_b64_size=19824"
            echo "expected_xz_sha256=e894b7298a8f182feb6b0e841c26a49424dd1cc19e1e4ff298499c85ba88df5a"
            echo "expected_patch_sha256=9d351c6cc297f71094c1390799193364147376771a07bdf7e54c01976a606239"
          } >> "$report"

          mkdir -p .p2wlan-diagnostics
          cp "$report" .p2wlan-diagnostics/path-observability-payload-report.txt

      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .p2wlan-diagnostics/path-observability-payload-report.txt
          git commit -m "feat:记录路径可观测性载荷诊断"
          git push origin HEAD:feat/path-observability-20260902
