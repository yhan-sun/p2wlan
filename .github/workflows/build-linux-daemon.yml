name: Build Linux Daemon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    name: Build p2wlan-daemon (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Build release daemon
        run: cargo build -p p2wlan-daemon --release

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2wlan-daemon-linux-x86_64
          path: target/release/p2wlan-daemon
          retention-days: 7