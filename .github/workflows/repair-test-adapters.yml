name: Repair Test Adapters

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/repair-test-adapters.yml']

permissions:
  contents: read

jobs:
  adapters:
    if: github.event.pull_request.number == 69 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/reliability-diagnostics-speedtest-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Prepare hash-verified regression fixes as immutable source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          api = 'https://api.github.com/repos/yhan-sun/p2wlan'
          def request(endpoint, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(api + endpoint, data=body, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(req, timeout=60) as response: return json.load(response)
          def blob_hash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def blob(sha):
              data = base64.b64decode(request('/git/blobs/' + sha)['content'])
              assert blob_hash(data) == sha
              return data
          edits = {}
          for entry in json.loads(blob('fc01d87580f094230a951f0d944acf72021f94df')):
              path = pathlib.Path(entry['path'])
              assert str(path).startswith(('apps/flutter_client/', 'client/daemon/src/diagnostics/'))
              source = path.read_bytes()
              assert blob_hash(source) == entry['source_sha'], str(path)
              text = source.decode()
              result = ''.join(op if isinstance(op, str) else text[op[0]:op[1]] for op in entry['ops']).encode()
              assert blob_hash(result) == entry['sha'], str(path)
              edits[str(path)] = result
          prepared = {
              'apps/flutter_client/test/desktop_tray_controller_test.dart': '2b32617ad6f0dee757e3cd46ee163585c04ad5a1',
              'apps/flutter_client/test/login_page_test.dart': '10351242deeb0a099c7ee126394317f76a0efb39',
              'apps/flutter_client/test/onboarding_page_test.dart': '6e050b541d4a81bbe16bc65d704d7bf984543c4d',
              'apps/flutter_client/test/p15_widget/helpers.dart': 'cd0fde15d96666a68e61eb092fc71ab5b7bf407d',
              'apps/flutter_client/test/status_store_test.dart': '9b7d81f84c92c8bdc3cb6cc3d1742de8c3d88737',
              'apps/flutter_client/test/startup_regression_test.dart': '66ecb63579035ecd1cea0ff1e6714bfc55ae7fd0',
          }
          for path, sha in prepared.items(): edits[path] = blob(sha)
          for path, data in edits.items(): pathlib.Path(path).write_bytes(data)
          subprocess.run(['dart', 'format', *[p for p in edits if p.endswith('.dart')]], check=True)
          entries = []
          for path in edits:
              data = pathlib.Path(path).read_bytes()
              sha = request('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})['sha']
              assert sha == blob_hash(data)
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
          result = {
              'parent': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
              'base_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}']).decode().strip(),
              'entries': entries,
          }
          pathlib.Path('/tmp/test-adapters.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-adapters-${{ github.event.pull_request.head.sha }}
          path: /tmp/test-adapters.json
          retention-days: 7
      - name: Analyze and run all Flutter tests
        working-directory: apps/flutter_client
        run: |
          flutter pub get
          flutter analyze
          flutter test
