name: Path State Audit Snapshot

on:
  push:
    branches:
      - ops/path-state-audit-snapshot-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=path-state-source.tar.gz HEAD
          sha256sum path-state-source.tar.gz > path-state-source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: path-state-source-${{ github.sha }}
          path: |
            path-state-source.tar.gz
            path-state-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
