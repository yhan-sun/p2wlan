name: Friend Rooms

on:
  push:
    branches: [feat/friend-rooms-20260907]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: friend-rooms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Room development source evidence
    if: github.ref == 'refs/heads/feat/friend-rooms-20260907'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Archive exact tracked source
        run: git archive --format=tar.gz HEAD -o "${RUNNER_TEMP}/p2wlan-room-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2wlan-room-source-${{ github.sha }}
          path: ${{ runner.temp }}/p2wlan-room-source.tar.gz
          retention-days: 3
  server:
    name: Room server race and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Go vet
        working-directory: server
        run: go vet ./...
      - name: Race and regression tests
        working-directory: server
        run: go test -race ./... -count=1
      - name: Archive pinned development dependencies
        if: github.ref == 'refs/heads/feat/friend-rooms-20260907'
        working-directory: server
        run: |
          go mod vendor
          tar -czf "${RUNNER_TEMP}/p2wlan-go-vendor.tar.gz" vendor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref == 'refs/heads/feat/friend-rooms-20260907'
        with:
          name: p2wlan-go-vendor-${{ github.sha }}
          path: ${{ runner.temp }}/p2wlan-go-vendor.tar.gz
          retention-days: 1
