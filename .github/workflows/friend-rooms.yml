name: Friend Rooms

on:
  push:
    branches: [feat/friend-rooms-20260907]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A commit validation (push / pull_request) and a periodic health check
  # (schedule / workflow_dispatch) are different obligations for the same
  # ref. Sharing one concurrency group let a scheduled run cancel an
  # in-flight commit validation, so each event class gets its own group and
  # only a pull request cancels its own superseded predecessors.
  group: friend-rooms-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Room development source evidence
    if: github.ref == 'refs/heads/feat/friend-rooms-20260907'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Archive exact tracked source
        run: git archive --format=tar.gz HEAD -o "${RUNNER_TEMP}/p2wlan-room-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2wlan-room-source-${{ github.sha }}
          path: ${{ runner.temp }}/p2wlan-room-source.tar.gz
          retention-days: 3
  server:
    name: Room server race and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Go vet
        working-directory: server
        run: go vet ./...
      - name: Race and regression tests
        working-directory: server
        run: go test -race ./... -count=1
      - name: Archive pinned development dependencies
        if: github.ref == 'refs/heads/feat/friend-rooms-20260907'
        working-directory: server
        run: |
          go mod vendor
          tar -czf "${RUNNER_TEMP}/p2wlan-go-vendor.tar.gz" vendor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref == 'refs/heads/feat/friend-rooms-20260907'
        with:
          name: p2wlan-go-vendor-${{ github.sha }}
          path: ${{ runner.temp }}/p2wlan-go-vendor.tar.gz
          retention-days: 1
