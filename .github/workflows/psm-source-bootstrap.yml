name: PSM Source Bootstrap

on:
  push:
    branches:
      - refactor/path-state-machine-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package source trees
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/current-head.tar.gz HEAD
          git archive --format=tar.gz --output=/tmp/current-main.tar.gz refs/remotes/origin/main
          git archive --format=tar.gz --output=/tmp/explicit-path-state-machine.tar.gz refs/remotes/origin/refactor/explicit-path-state-machine-20260828
          git archive --format=tar.gz --output=/tmp/path-state-machine-core.tar.gz refs/remotes/origin/refactor/path-state-machine-core-20260828
          git archive --format=tar.gz --output=/tmp/atomic-path-mtu-observability.tar.gz refs/remotes/origin/refactor/atomic-path-mtu-observability-20260828
          git bundle create /tmp/p2wlan-source.bundle --all
      - name: Upload source snapshots
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-source-snapshot-${{ github.sha }}
          path: |
            /tmp/*.tar.gz
            /tmp/p2wlan-source.bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
