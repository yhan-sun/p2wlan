name: Debug handshake publish

on:
  push:
    branches:
      - test/nat-topology-gate-v4-20260828
    paths:
      - .github/workflows/debug-handshake-publish.yml
      - .github/scripts/instrument_handshake_publish.py

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/nat-topology-gate-v4-20260828
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Instrument publish transaction
        run: python3 .github/scripts/instrument_handshake_publish.py
      - name: Run one Relay-only topology round
        shell: bash
        env:
          ROUNDS: '1'
          MODE: relay-only
          DIRECT_TIMEOUT_S: '15'
          OVERLAY_TIMEOUT_S: '15'
          NAT_SIM_ARTIFACT_DIR: ${{ runner.temp }}/handshake-publish-debug
          NAT_SIM_RUN_ID: handshake-publish-${{ github.run_id }}
          NAT_SEED_BASE: '20260829'
        run: bash scripts/nat-sim/nat-sim-smoke.sh
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handshake-publish-debug-${{ github.sha }}
          path: |
            ${{ runner.temp }}/handshake-publish-debug/**
          if-no-files-found: error
          retention-days: 1
