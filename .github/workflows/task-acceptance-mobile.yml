name: Task Acceptance - Mobile Lifecycle

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: task-acceptance-mobile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency:
    name: Wait for Windows lifecycle on main
    if: github.head_ref == 'test/mobile-lifecycle-regression-20260828'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Wait for the prior task marker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            if gh api "repos/$REPO/contents/.github/workflows/windows-lifecycle-required.yml?ref=main" >/dev/null 2>&1; then
              echo "Windows lifecycle marker is present on main"
              exit 0
            fi
            sleep 30
          done
          echo "Windows lifecycle task did not land on main" >&2
          exit 1

  sync:
    name: Sync mobile branch with main
    needs: dependency
    runs-on: ubuntu-latest
    outputs:
      accepted_sha: ${{ steps.state.outputs.accepted_sha }}
      synchronized: ${{ steps.state.outputs.synchronized }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
      EVENT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Merge latest main into the task branch
        shell: bash
        run: |
          set -euo pipefail
          set +e
          response="$(gh api --method POST "repos/$REPO/merges" \
            -f base="$HEAD_REF" \
            -f head="main" \
            -f commit_message="chore: synchronize mobile lifecycle task with main" 2>&1)"
          status=$?
          set -e
          if [[ "$status" -ne 0 ]] && ! grep -Eqi 'No commits between|already up.to.date' <<<"$response"; then
            printf '%s\n' "$response" >&2
            exit "$status"
          fi
      - name: Determine whether this run still owns the branch head
        id: state
        shell: bash
        run: |
          current="$(gh api "repos/$REPO/branches/$HEAD_REF" --jq '.commit.sha')"
          echo "accepted_sha=$current" >> "$GITHUB_OUTPUT"
          if [[ "$current" == "$EVENT_SHA" ]]; then
            echo "synchronized=true" >> "$GITHUB_OUTPUT"
          else
            echo "synchronized=false" >> "$GITHUB_OUTPUT"
            echo "branch advanced to $current; a synchronize event will restart acceptance"
          fi

  accept:
    name: Mobile lifecycle acceptance and merge
    needs: sync
    if: needs.sync.outputs.synchronized == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ needs.sync.outputs.accepted_sha }}
    steps:
      - name: Wait for the complete acceptance set
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "CI Required"
            "Windows Lifecycle Required"
            "Mobile Lifecycle Required"
            "Analyze and Test"
            "Android arm64 Release APK"
            "Linux x64 Release Bundle"
            "macOS Release Apps"
            "Windows x64 Release Bundle"
            "iOS Compile"
            "macOS arm64 test DMG"
            "Android arm64 test APK"
          )
          for attempt in $(seq 1 180); do
            checks="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq '.check_runs | map({name, status, conclusion})')"
            failed=0
            pending=0
            for name in "${required[@]}"; do
              state="$(jq -r --arg name "$name" '
                [.[] | select(.name == $name)]
                | if length == 0 then "missing"
                  elif any(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "stale") then "failed"
                  elif any(.status != "completed") then "pending"
                  elif any(.conclusion == "success") then "success"
                  else "pending" end
              ' <<<"$checks")"
              printf '%-36s %s\n' "$name" "$state"
              case "$state" in failed) failed=1 ;; missing|pending) pending=1 ;; esac
            done
            if [[ "$failed" -ne 0 ]]; then exit 1; fi
            if [[ "$pending" -eq 0 ]]; then exit 0; fi
            sleep 30
          done
          exit 1
      - name: Verify and merge the accepted head
        shell: bash
        run: |
          current="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          test "$current" = "$HEAD_SHA"
          gh pr merge "$PR" --repo "$REPO" --merge --match-head-commit "$HEAD_SHA"
