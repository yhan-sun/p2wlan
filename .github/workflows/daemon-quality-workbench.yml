name: Daemon quality workbench

on:
  push:
    branches: [automation/daemon-quality-workbench]
    paths:
      - .github/workbench/run.json

permissions:
  contents: read

concurrency:
  group: daemon-quality-workbench
  cancel-in-progress: false

env:
  SOURCE_BASE: f2f601dbb47a705b490491996d16af2e3324d16d
  TARGET_BRANCH: refactor/daemon-quality-hardening
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  candidate:
    if: github.repository == 'yhan-sun/p2wlan'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_BASE }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: workbench
          sparse-checkout: .github/workbench
          persist-credentials: false
      - name: Reconstruct reviewed source with before and after digests
        run: python3 workbench/.github/workbench/apply_recipe.py candidate
      - name: Commit candidate before testing
        id: commit
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'feat:拆分daemon六个核心模块并修复会话碰撞与队列边界'
          mkdir -p "$RUNNER_TEMP/quality-candidate"
          git rev-parse HEAD > "$RUNNER_TEMP/quality-candidate/commit.txt"
          git bundle create "$RUNNER_TEMP/quality-candidate/candidate.bundle" HEAD "^$SOURCE_BASE"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daemon-quality-candidate
          path: ${{ runner.temp }}/quality-candidate/
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    env:
      EXPECTED_COMMIT: ${{ needs.candidate.outputs.commit }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_BASE }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: daemon-quality-candidate
          path: ${{ runner.temp }}/quality-candidate
      - name: Select exact candidate
        run: |
          set -euo pipefail
          git fetch "$RUNNER_TEMP/quality-candidate/candidate.bundle" HEAD
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD^)" = "$SOURCE_BASE"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Python policy and evidence regression tests
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/quality/tests -p 'test_*.py'
          python -m unittest discover -s scripts/dplpmtud -p 'test_*.py'
          python -m unittest discover -s scripts/security/tests -p 'test_*.py'
          python scripts/quality/check_code_health.py --base-ref "$SOURCE_BASE"
      - name: Format and clippy
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked -p p2wlan-daemon --all-targets --all-features -- -D warnings
      - name: General daemon regression suite
        run: |
          set -euo pipefail
          cargo test --locked -p p2wlan-daemon --lib -- --test-threads=1 --skip hard_hard_ 2>&1 | tee "$RUNNER_TEMP/daemon-general.log"
      - name: Isolated Hard-Hard suite
        run: |
          set -euo pipefail
          python scripts/quality/run_rust_tests.py hard_hard_ --each 2>&1 | tee "$RUNNER_TEMP/daemon-hard-hard.log"
      - name: Exact collision and queue regressions
        run: |
          set -euo pipefail
          python scripts/quality/run_rust_tests.py transport::tests::pending_receiver_index_collision_tries_every_matching_key --exact
          python scripts/quality/run_rust_tests.py transport::tests::replay_classification_uses_the_error_variant_not_its_message --exact
          python scripts/quality/run_rust_tests.py network_outbound::queue::tests::oversized_packet_cannot_exceed_the_queue_byte_bound_or_evict_valid_packets --exact
          python scripts/quality/run_rust_tests.py network_outbound::queue::tests::empty_queue_rejects_a_single_oversized_packet --exact
      - name: DPLPMTUD evidence contract against executed tests
        if: runner.os == 'Linux'
        run: bash scripts/dplpmtud/run_acceptance.sh "$RUNNER_TEMP/quality-dplpmtud-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: daemon-quality-tests-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/daemon-general.log
            ${{ runner.temp }}/daemon-hard-hard.log
            ${{ runner.temp }}/quality-dplpmtud-evidence/
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [candidate, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      EXPECTED_COMMIT: ${{ needs.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: daemon-quality-candidate
          path: ${{ runner.temp }}/quality-candidate
      - name: Publish only the validated fast-forward branch commit
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_BRANCH" = refactor/daemon-quality-hardening
          test "$(git rev-parse HEAD)" = "$SOURCE_BASE"
          git fetch "$RUNNER_TEMP/quality-candidate/candidate.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse FETCH_HEAD^)" = "$SOURCE_BASE"
          git push origin "$EXPECTED_COMMIT:refs/heads/$TARGET_BRANCH"
