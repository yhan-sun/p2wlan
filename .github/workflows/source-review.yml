name: Source review
on:
  push:
    branches: [docs/deployment-and-agent-contracts]
    paths: [.github/workflows/source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify pinned Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review/gradle/wrapper review/assets
          base=https://raw.githubusercontent.com/gradle/gradle/e45a8dbf2470c2e2474ccc25be9f49331406a07e
          for file in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar; do
            curl --fail --location --proto '=https' --proto-redir '=https' --output "review/$file" "$base/$file"
          done
          curl --fail --location --proto '=https' --proto-redir '=https' --output review/gradle-9.1.0-wrapper.jar.sha256 https://services.gradle.org/distributions/gradle-9.1.0-wrapper.jar.sha256
          curl --fail --location --proto '=https' --proto-redir '=https' --output review/gradle-9.1.0-all.zip.sha256 https://services.gradle.org/distributions/gradle-9.1.0-all.zip.sha256
          expected=$(cat review/gradle-9.1.0-wrapper.jar.sha256)
          echo "$expected  review/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          cp assets/readme/* review/assets/
          sha256sum review/gradlew review/gradlew.bat review/gradle/wrapper/gradle-wrapper.jar > review/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-and-public-assets
          path: review
          retention-days: 1
