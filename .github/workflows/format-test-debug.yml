name: Format Test Debug

on:
  push:
    branches: [feat/desktop-login-startup]
    paths: [.github/workflows/format-test-debug.yml]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Format exact test source
        working-directory: apps/flutter_client
        run: dart format test/windows_startup_registration_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-startup-test-formatted
          path: apps/flutter_client/test/windows_startup_registration_test.dart
          if-no-files-found: error
          retention-days: 1
