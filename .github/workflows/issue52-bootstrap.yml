name: Issue 52 Zero Exception Bootstrap

on:
  push:
    branches:
      - fix/remove-glib-rustsec-0429-20260906

permissions:
  contents: write

jobs:
  zero-exception-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Make Python 3.9 fallback accept zero exceptions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/security/dependency_reports.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if ignore_value is None:\n        raise ValueError("missing [advisories].ignore")\n'''
          new = '''    if ignore_value is None:\n        ignore_value = []\n'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("unexpected dependency_reports.py fallback shape")
          PY

      - name: Verify zero-exception security tests
        run: python3 -m unittest discover -s scripts/security/tests -p 'test_*.py'

      - name: Commit fallback fix
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/security/dependency_reports.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/security/dependency_reports.py
          git commit -m "feat:兼容零安全例外证据解析"
          git push origin "HEAD:${GITHUB_REF_NAME}"
