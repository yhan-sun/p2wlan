name: Issue 52 Zero Exception Bootstrap

on:
  push:
    branches:
      - fix/remove-glib-rustsec-0429-20260906

permissions:
  contents: write

jobs:
  zero-exception-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Align zero-exception parser and repository regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          parser = Path("scripts/security/dependency_reports.py")
          text = parser.read_text(encoding="utf-8")
          old = '''    if ignore_value is None:\n        raise ValueError("missing [advisories].ignore")\n'''
          new = '''    if ignore_value is None:\n        ignore_value = []\n'''
          if old in text:
              parser.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("unexpected dependency_reports.py fallback shape")

          tests = Path("scripts/security/tests/test_security_audit.py")
          text = tests.read_text(encoding="utf-8")
          old = '''    def test_rust_report_reads_deny_and_emits_current_exception(self) -> None:\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            args = self.rust_args(\n                root,\n                deny_config=SECURITY_DIR.parents[1] / "deny.toml",\n                advisory_exceptions=SECURITY_DIR.parents[1] / "security" / "advisory-exceptions.json",\n            )\n            evidence = dependency_reports.rust_summary(args)\n            self.assertEqual(evidence["result"], "pass")\n            self.assertEqual(evidence["advisory_exception_count"], 1)\n            self.assertEqual(evidence["advisory_exception_ids"], ["RUSTSEC-2024-0429"])\n            self.assertEqual(evidence["advisory_ignores"][0]["package"], "glib")\n            self.assertEqual(evidence["advisory_ignores"][0]["tracking_issue"], 52)\n'''
          new = '''    def test_rust_report_reads_repository_zero_exception_contract(self) -> None:\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            args = self.rust_args(\n                root,\n                deny_config=SECURITY_DIR.parents[1] / "deny.toml",\n                advisory_exceptions=SECURITY_DIR.parents[1] / "security" / "advisory-exceptions.json",\n            )\n            evidence = dependency_reports.rust_summary(args)\n            self.assertEqual(evidence["result"], "pass")\n            self.assertEqual(evidence["advisory_exception_count"], 0)\n            self.assertEqual(evidence["advisory_exception_ids"], [])\n            self.assertEqual(evidence["advisory_ignores"], [])\n'''
          if old in text:
              tests.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("unexpected repository exception regression shape")
          PY

      - name: Verify zero-exception security tests
        run: python3 -m unittest discover -s scripts/security/tests -p 'test_*.py'

      - name: Commit security evidence compatibility fix
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/security/dependency_reports.py scripts/security/tests/test_security_audit.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/security/dependency_reports.py scripts/security/tests/test_security_audit.py
          git commit -m "feat:兼容零安全例外证据解析"
          git push origin "HEAD:${GITHUB_REF_NAME}"
