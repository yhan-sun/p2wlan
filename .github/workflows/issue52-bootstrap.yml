name: Issue 52 Platform Check

on:
  push:
    branches:
      - fix/remove-glib-rustsec-0429-20260906

permissions:
  contents: read

jobs:
  native-tray:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Test native tray
        run: cargo test -p p2wlan-tray --locked

      - name: Verify vulnerable GTK dependency chain is gone
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for package in glib gtk libappindicator tao tray-icon; do
            if grep -q "^name = \"${package}\"$" Cargo.lock; then
              echo "unexpected package remains in Cargo.lock: ${package}" >&2
              exit 1
            fi
          done
          grep -q '^name = "trayicon"$' Cargo.lock
          grep -q '^name = "winit"$' Cargo.lock
