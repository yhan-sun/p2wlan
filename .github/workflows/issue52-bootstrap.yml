name: Issue 52 Bootstrap

on:
  push:
    branches:
      - fix/remove-glib-rustsec-0429-20260906

permissions:
  contents: write

jobs:
  tray-and-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Resolve and compile native tray
        run: cargo check -p p2wlan-tray

      - name: Verify vulnerable GTK dependency chain is gone
        run: |
          set -euo pipefail
          for package in glib gtk libappindicator tao tray-icon; do
            if grep -q "^name = \"${package}\"$" Cargo.lock; then
              echo "unexpected package remains in Cargo.lock: ${package}" >&2
              exit 1
            fi
          done
          grep -q '^name = "trayicon"$' Cargo.lock
          grep -q '^name = "winit"$' Cargo.lock

      - name: Commit Cargo-resolved lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "feat:同步无GTK托盘依赖锁文件"
          git push origin "HEAD:${GITHUB_REF_NAME}"
