name: Issue 52 Bootstrap

on:
  push:
    branches:
      - fix/remove-glib-rustsec-0429-20260906

permissions:
  contents: read

jobs:
  tray-and-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Resolve and compile native tray
        id: tray_check
        continue-on-error: true
        run: cargo check -p p2wlan-tray

      - name: Verify vulnerable GTK dependency chain is gone
        run: |
          set -euo pipefail
          for package in glib gtk libappindicator tao tray-icon; do
            if grep -q "^name = \"${package}\"$" Cargo.lock; then
              echo "unexpected package remains in Cargo.lock: ${package}" >&2
              exit 1
            fi
          done
          grep -q '^name = "trayicon"$' Cargo.lock
          grep -q '^name = "winit"$' Cargo.lock

      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue52-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

      - name: Enforce tray compile result
        if: steps.tray_check.outcome != 'success'
        run: exit 1
