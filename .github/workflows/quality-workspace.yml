name: Quality workspace

on:
  push:
    branches: [refactor/project-quality-baseline]
    paths: [.github/workflows/quality-workspace.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Archive isolated syntax tools
        run: |
          mkdir -p "$RUNNER_TEMP/quality-tools/wheels"
          python3 -m pip download --only-binary=:all: --python-version=311 --implementation=cp --abi=cp311 --abi=abi3 --platform=manylinux2014_x86_64 --platform=manylinux_2_28_x86_64 --dest "$RUNNER_TEMP/quality-tools/wheels" tree-sitter tree-sitter-rust
          cp "$(rustup which rustfmt)" "$RUNNER_TEMP/quality-tools/rustfmt"
          rustfmt --version > "$RUNNER_TEMP/quality-tools/rustfmt-version.txt"
          ldd "$(rustup which rustfmt)" > "$RUNNER_TEMP/quality-tools/rustfmt-libraries.txt"
          tar -czf "$RUNNER_TEMP/quality-tools.tar.gz" -C "$RUNNER_TEMP" quality-tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-tools-${{ github.sha }}
          path: ${{ runner.temp }}/quality-tools.tar.gz
          if-no-files-found: error
          retention-days: 1
