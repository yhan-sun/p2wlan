name: Quality workspace

on:
  push:
    branches: [refactor/project-quality-baseline]
    paths: [.github/workflows/quality-workspace.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Archive isolated offline verification tools
        run: |
          mkdir -p "$RUNNER_TEMP/offline/wheels" "$RUNNER_TEMP/offline/rust"
          python3 -m pip download --only-binary=:all: --python-version=313 --implementation=cp --abi=cp313 --abi=abi3 --platform=manylinux2014_x86_64 --platform=manylinux_2_28_x86_64 --dest "$RUNNER_TEMP/offline/wheels" tree-sitter tree-sitter-rust
          toolchain="$(dirname "$(dirname "$(rustup which rustc)")")"
          cp -a "$toolchain/bin" "$toolchain/lib" "$RUNNER_TEMP/offline/rust/"
          cargo vendor --locked "$RUNNER_TEMP/offline/vendor" > "$RUNNER_TEMP/offline/vendor-config.toml"
          rustc --version > "$RUNNER_TEMP/offline/rust-version.txt"
          tar -czf "$RUNNER_TEMP/quality-offline.tar.gz" -C "$RUNNER_TEMP" offline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-offline-${{ github.sha }}
          path: ${{ runner.temp }}/quality-offline.tar.gz
          if-no-files-found: error
          retention-days: 1
