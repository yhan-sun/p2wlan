name: Apply NAT topology v4

on:
  push:
    branches:
      - test/nat-topology-gate-v4-20260828
    paths:
      - ".github/workflows/apply-nat-v4.yml"
      - ".github/patches/nat-v4.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/nat-topology-gate-v4-20260828
          fetch-depth: 0
      - name: Apply reviewed patch
        run: |
          set -euo pipefail
          git apply --check .github/patches/nat-v4.patch
          git apply .github/patches/nat-v4.patch
          rm .github/patches/nat-v4.patch .github/workflows/apply-nat-v4.yml
          bash -n scripts/nat-sim/nat-sim-smoke.sh
          bash -n scripts/nat-sim/run-ci-topology.sh
          git diff --check
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(nat): add deterministic topology gate"
          git push origin HEAD:test/nat-topology-gate-v4-20260828
