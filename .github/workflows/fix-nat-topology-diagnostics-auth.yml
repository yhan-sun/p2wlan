name: Fix NAT Topology Diagnostics Auth

on:
  push:
    branches:
      - test/nat-topology-matrix-20260828
    paths:
      - ".github/workflows/fix-nat-topology-diagnostics-auth.yml"

permissions:
  contents: write

concurrency:
  group: fix-nat-topology-diagnostics-auth
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/nat-topology-matrix-20260828
          fetch-depth: 0
      - name: Apply exact auth-file isolation patch
        run: python3 scripts/dev/fix_nat_topology_diagnostics_auth.py
      - name: Validate shell and patch
        run: |
          bash -n scripts/nat-sim/nat-sim-smoke.sh
          bash -n scripts/nat-sim/run-topology-matrix.sh
          python3 -m unittest discover -s scripts/nat-sim -p 'test_*.py'
          git diff --check
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/dev/fix_nat_topology_diagnostics_auth.py
          rm .github/workflows/fix-nat-topology-diagnostics-auth.yml
          rmdir scripts/dev 2>/dev/null || true
      - name: Commit repaired harness
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(nat): isolate daemon diagnostics auth files"
          git push origin HEAD:test/nat-topology-matrix-20260828
