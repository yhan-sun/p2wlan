name: Rekey Reliability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A commit validation (push / pull_request) and a periodic health check
  # (schedule / workflow_dispatch) are different obligations for the same
  # ref. Sharing one concurrency group let a scheduled run cancel an
  # in-flight commit validation, so each event class gets its own group and
  # only a pull request cancels its own superseded predecessors.
  group: rekey-reliability-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rekey:
    name: Rekey Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Build once and run maintenance, rekey contention, and existing rekey selections
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/rekey-test-plan.json"
          cat > "$plan" <<'JSON'
          [
            {"name":"maintenance","selector":"maintenance_"},
            {"name":"contention","selector":"maintenance_integration_tests::maintenance_rekey_loop_retries_binding_without_kick_and_preserves_business","exact":true,"repeat":10},
            {"name":"existing-rekey","selector":"rekey"}
          ]
          JSON
          python3 scripts/quality/run_rust_tests.py \
            --plan "$plan" \
            --evidence-dir "$RUNNER_TEMP/rekey-test-evidence" \
            --test-timeout-seconds 60
      - name: Upload rekey test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rekey-test-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rekey-test-evidence
          if-no-files-found: warn
          retention-days: 14
