name: Rekey Reliability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A commit validation (push / pull_request) and a periodic health check
  # (schedule / workflow_dispatch) are different obligations for the same
  # ref. Sharing one concurrency group let a scheduled run cancel an
  # in-flight commit validation, so each event class gets its own group and
  # only a pull request cancels its own superseded predecessors.
  group: rekey-reliability-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rekey:
    name: Rekey Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Maintenance scheduler and lifecycle regressions
        run: cargo test -p p2wlan-daemon --lib maintenance_ -- --test-threads=1
      - name: Repeat real rekey contention and business continuity regression
        shell: bash
        run: |
          set -euo pipefail
          for iteration in $(seq 1 10); do
            echo "Rekey contention round ${iteration}/10"
            cargo test -p p2wlan-daemon --lib maintenance_rekey_loop_retries_binding_without_kick_and_preserves_business -- --test-threads=1
          done
      - name: Existing transport rekey and confirmation regressions
        run: cargo test -p p2wlan-daemon --lib rekey -- --test-threads=1
