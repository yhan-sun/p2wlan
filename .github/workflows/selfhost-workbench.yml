name: Selfhost repair workbench
on:
  push:
    branches: [work/selfhost-issue78-20260913]
    paths: [.github/workflows/selfhost-workbench.yml]
permissions:
  contents: read
jobs:
  stage:
    if: github.repository == 'yhan-sun/p2wlan' && github.ref == 'refs/heads/work/selfhost-issue78-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply checked follow-up only to the reviewed PR head
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          parent = '630ef30ab55944b1a8953fe61bd816ac422cd878'
          data = Path('.selfhost-workbench/followup.b64').read_text(encoding='utf-8').strip()
          patch = lzma.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'fe9d00d1f5a7a601f1bf3831907039f7345c2c0187aa85b947f4c054086ee11b'
          path = Path(os.environ['RUNNER_TEMP']) / 'selfhost-followup.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'checkout', '--detach', parent], check=True)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert paths and all(p.startswith(('server/', 'docs/self-hosting.md')) for p in paths)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--stat'], check=True)
          PY
      - name: Fast-forward the unchanged repair branch only
        shell: bash
        run: |
          set -euo pipefail
          PARENT=630ef30ab55944b1a8953fe61bd816ac422cd878
          RESULT=fix/selfhost-issue78-20260913
          test "$(git ls-remote origin refs/heads/$RESULT | cut -f1)" = "$PARENT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat:修复Windows身份冲突和私有文件访问控制'
          git push origin "HEAD:refs/heads/$RESULT"
          echo "Follow-up source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
