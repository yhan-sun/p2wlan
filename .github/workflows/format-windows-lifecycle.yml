name: Format Windows lifecycle test

on:
  push:
    branches:
      - fix/windows-lifecycle-dart-format-20260828
    paths:
      - ".github/workflows/format-windows-lifecycle.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-lifecycle-dart-format-20260828
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: apps/flutter_client
        run: flutter pub get
      - name: Restore Flutter-managed files and format lifecycle test
        run: |
          set -euo pipefail
          bash scripts/release/hermetic_build.sh restore
          cd apps/flutter_client
          dart format test/windows_daemon_lifecycle_integration_test.dart
          dart format --output=none --set-exit-if-changed test/windows_daemon_lifecycle_integration_test.dart
      - name: Commit formatted test
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter_client/test/windows_daemon_lifecycle_integration_test.dart
          git diff --cached --quiet && { echo "file was already formatted"; exit 0; }
          git commit -m "style(windows): format lifecycle regression"
          git push origin HEAD:fix/windows-lifecycle-dart-format-20260828
