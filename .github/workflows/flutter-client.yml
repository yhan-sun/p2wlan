name: Flutter Client

on:
  push:
    branches:
      - main
      - codex/**
    paths:
      - "apps/flutter_client/**"
      - ".github/workflows/flutter-client.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "apps/flutter_client/**"
      - ".github/workflows/flutter-client.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/flutter_client

jobs:
  analyze-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android Debug APK
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-android-debug-apk
          path: apps/flutter_client/build/app/outputs/flutter-apk/app-debug.apk

  linux:
    name: Linux Debug Bundle
    runs-on: ubuntu-22.04
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux debug bundle
        run: flutter build linux --debug

      - name: Pack Linux bundle
        run: tar -C build/linux/x64/debug/bundle -czf build/p2wlan-flutter-linux-debug.tar.gz .

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-linux-debug
          path: apps/flutter_client/build/p2wlan-flutter-linux-debug.tar.gz

  macos:
    name: macOS Debug App
    runs-on: macos-14
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS debug app
        run: flutter build macos --debug

      - name: Pack macOS app
        run: ditto -c -k --keepParent "build/macos/Build/Products/Debug/P2WLAN Diagnostics.app" build/p2wlan-flutter-macos-debug.app.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-macos-debug
          path: apps/flutter_client/build/p2wlan-flutter-macos-debug.app.zip

  windows:
    name: Windows Debug Bundle
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows debug bundle
        run: flutter build windows --debug

      - name: Pack Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Debug/* -DestinationPath build/p2wlan-flutter-windows-debug.zip -Force

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-windows-debug
          path: apps/flutter_client/build/p2wlan-flutter-windows-debug.zip
