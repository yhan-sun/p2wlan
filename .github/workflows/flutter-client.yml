name: Flutter Client

on:
  push:
    branches:
      - main
      - codex/**
    paths:
      - "apps/flutter_client/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "client/android-native/**"
      - "client/tun/**"
      - "scripts/build_android_native.sh"
      # The daemon owns the authoritative status/route/event contract the
      # Flutter client consumes; changes must re-run client tests + contract
      # test (ADR 0004, P2-04).
      - "client/daemon/src/diagnostics/**"
      - "client/daemon/src/route/**"
      - "client/daemon/src/connection_timeline.rs"
      - "client/daemon/**"
      - "client/tray/**"
      # Shared daemon <-> client contract fixtures (single source of truth for
      # the wire format; both sides must stay in lockstep).
      - "contracts/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ main ]
    paths:
      - "apps/flutter_client/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "client/android-native/**"
      - "client/tun/**"
      - "scripts/build_android_native.sh"
      - "client/daemon/src/diagnostics/**"
      - "client/daemon/src/route/**"
      - "client/daemon/src/connection_timeline.rs"
      - "client/daemon/**"
      - "client/tray/**"
      - "contracts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/flutter_client

jobs:
  analyze-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android arm64 Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Configure Android NDK for Rust bridge
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          ndk_root="$(find "$sdk_root/ndk" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          echo "ANDROID_NDK_HOME=$ndk_root" >> "$GITHUB_ENV"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build arm64 release APK
        env:
          P2WLAN_ANDROID_ABIS: arm64-v8a
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-android-arm64-release-apk
          path: apps/flutter_client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  linux:
    name: Linux x64 Release Bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libjsoncpp-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux daemon
        working-directory: .
        run: cargo build -p p2wlan-daemon --release

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Bundle Linux daemon
        run: install -m 0755 ../../target/release/p2wlan-daemon build/linux/x64/release/bundle/p2wlan-daemon

      - name: Pack Linux bundle
        run: tar -C build/linux/x64/release/bundle -czf build/p2wlan-flutter-linux-x64-release.tar.gz .

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-linux-x64-release
          path: apps/flutter_client/build/p2wlan-flutter-linux-x64-release.tar.gz

  macos:
    name: macOS Release Apps
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS release app
        run: flutter build macos --release

      - name: Pack macOS apps by architecture
        run: |
          set -euo pipefail
          src="build/macos/Build/Products/Release/P2WLAN.app"
          for arch in arm64 x86_64; do
            if [ "$arch" = "x86_64" ]; then
              label="x64"
            else
              label="$arch"
            fi
            dst_dir="build/macos/Build/Products/Release/$label"
            dst="$dst_dir/P2WLAN.app"
            rm -rf "$dst_dir"
            mkdir -p "$dst_dir"
            cp -R "$src" "$dst"
            for binary in \
              "$dst/Contents/MacOS/P2WLAN" \
              "$dst/Contents/Frameworks/App.framework/Versions/A/App" \
              "$dst/Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS"; do
              lipo "$binary" -thin "$arch" -output "$binary.thin"
              mv "$binary.thin" "$binary"
            done
            codesign --force --deep --sign - "$dst"
            ditto -c -k --keepParent "$dst" "build/p2wlan-flutter-macos-$label-release.app.zip"
          done

      - name: Upload macOS apps
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-macos-release
          path: apps/flutter_client/build/p2wlan-flutter-macos-*-release.app.zip

  windows:
    name: Windows x64 Release Bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows daemon
        working-directory: .
        run: cargo build -p p2wlan-daemon --release

      - name: Build Windows release bundle
        run: flutter build windows --release

      - name: Bundle Windows daemon
        shell: pwsh
        run: Copy-Item ..\..\target\release\p2wlan-daemon.exe build\windows\x64\runner\Release\p2wlan-daemon.exe -Force

      - name: Bundle Wintun runtime
        shell: pwsh
        working-directory: apps/flutter_client
        run: .\scripts\fetch_wintun.ps1 -DestinationDirectory "build\windows\x64\runner\Release" -Architecture amd64

      - name: Pack Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/p2wlan-flutter-windows-x64-release.zip -Force

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-windows-x64-release
          path: apps/flutter_client/build/p2wlan-flutter-windows-x64-release.zip

  ios:
    name: iOS Compile
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Compile unsigned iOS release
        run: flutter build ios --release --no-codesign
