name: Flutter Client

on:
  push:
    branches:
      - main
      - codex/**
    paths:
      - "apps/flutter_client/**"
      - ".github/workflows/flutter-client.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "apps/flutter_client/**"
      - ".github/workflows/flutter-client.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/flutter_client

jobs:
  analyze-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android arm64 Release APK
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-android-arm64-release-apk
          path: apps/flutter_client/build/app/outputs/flutter-apk/app-release.apk

  linux:
    name: Linux x64 Release Bundle
    runs-on: ubuntu-22.04
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Pack Linux bundle
        run: tar -C build/linux/x64/release/bundle -czf build/p2wlan-flutter-linux-x64-release.tar.gz .

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-linux-x64-release
          path: apps/flutter_client/build/p2wlan-flutter-linux-x64-release.tar.gz

  macos:
    name: macOS Release Apps
    runs-on: macos-14
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS release app
        run: flutter build macos --release

      - name: Pack macOS apps by architecture
        run: |
          set -euo pipefail
          src="build/macos/Build/Products/Release/P2WLAN Diagnostics.app"
          for arch in arm64 x86_64; do
            if [ "$arch" = "x86_64" ]; then
              label="x64"
            else
              label="$arch"
            fi
            dst_dir="build/macos/Build/Products/Release/$label"
            dst="$dst_dir/P2WLAN Diagnostics.app"
            rm -rf "$dst_dir"
            mkdir -p "$dst_dir"
            cp -R "$src" "$dst"
            for binary in \
              "$dst/Contents/MacOS/P2WLAN Diagnostics" \
              "$dst/Contents/Frameworks/App.framework/Versions/A/App" \
              "$dst/Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS"; do
              lipo "$binary" -thin "$arch" -output "$binary.thin"
              mv "$binary.thin" "$binary"
            done
            codesign --force --deep --sign - "$dst"
            ditto -c -k --keepParent "$dst" "build/p2wlan-flutter-macos-$label-release.app.zip"
          done

      - name: Upload macOS apps
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-macos-release
          path: apps/flutter_client/build/p2wlan-flutter-macos-*-release.app.zip

  windows:
    name: Windows x64 Release Bundle
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release bundle
        run: flutter build windows --release

      - name: Pack Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/p2wlan-flutter-windows-x64-release.zip -Force

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-windows-x64-release
          path: apps/flutter_client/build/p2wlan-flutter-windows-x64-release.zip
