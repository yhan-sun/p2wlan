name: Repair Workbench

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repair-workbench.yml'

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Prepare reproducible offline Rust formatting workbench
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p2wlan-rust-workbench/toolchain/bin
          git rev-parse HEAD > /tmp/p2wlan-rust-workbench/COMMIT
          rustfmt_path="$(rustup which rustfmt)"
          toolchain="$(dirname "$(dirname "$rustfmt_path")")"
          cp "$rustfmt_path" /tmp/p2wlan-rust-workbench/toolchain/bin/rustfmt
          cp -a "$toolchain/lib" /tmp/p2wlan-rust-workbench/toolchain/
          rustfmt --version > /tmp/p2wlan-rust-workbench/VERSION
          cd /tmp/p2wlan-rust-workbench
          tar -czf rustfmt-linux-x64.tar.gz toolchain
          rm -rf toolchain
          sha256sum rustfmt-linux-x64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2wlan-rust-workbench-${{ github.event.pull_request.head.sha }}
          path: /tmp/p2wlan-rust-workbench/
          retention-days: 1
