name: Repair Workbench

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repair-workbench.yml'

permissions:
  contents: read

jobs:
  recover:
    if: github.event.pull_request.number == 69 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/reliability-diagnostics-speedtest-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Restore hash-verified repair objects for review
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, tarfile, time, urllib.request
          root = pathlib.Path.cwd()
          out = pathlib.Path('/tmp/p2wlan-complete-repair')
          out.mkdir()
          api = 'https://api.github.com/repos/yhan-sun/p2wlan'
          def request(endpoint):
              req = urllib.request.Request(api + endpoint, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
              })
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response:
                          return json.load(response)
                  except Exception:
                      if attempt == 3: raise
                      time.sleep(2 ** attempt)
          def hash_blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          cache = {}
          def blob(sha):
              if sha not in cache:
                  data = base64.b64decode(request('/git/blobs/' + sha)['content'])
                  assert hash_blob(data) == sha, 'source blob integrity failure'
                  cache[sha] = data
              return cache[sha]
          manifests = [
              'e05ebdf96132cdc13132b630fbc51865bd2782df',
              '8820c08632498850b9faab3d65f5025c8a038636',
              '382f04f57057e133452d73307054bbb637923305',
              '3cc2186ddf31022e9f22e3597444e4497c45df20',
              'abcb60501826e9efb6b6270f5d909261aae6103e',
          ]
          changed = {}
          for manifest in manifests:
              for entry in json.loads(blob(manifest)):
                  path = entry['path']
                  assert '..' not in pathlib.PurePosixPath(path).parts and not path.startswith('/')
                  assert path.startswith(('client/', 'apps/', 'scripts/', 'docs/')) or path == '.github/workflows/ci.yml'
                  if 'blob' in entry:
                      content = blob(entry['blob'])
                  else:
                      source_sha = entry.get('source_blob', entry.get('source_sha'))
                      source = blob(source_sha).decode() if source_sha else ''
                      text = ''.join(op if isinstance(op, str) else source[op[0]:op[1]] for op in entry['ops'])
                      content = text.encode()
                      assert hash_blob(content) == entry['sha'], 'recovered hash mismatch: ' + path
                  changed[path] = content
          for path, content in changed.items():
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          (root / '.github/workflows/repair-workbench.yml').unlink()
          subprocess.run(['dart', 'format', *[p for p in changed if p.endswith('.dart')]], check=True)
          subprocess.run(['cargo', 'fmt', '--all'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          diff = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          tree = []
          for path in filter(None, diff):
              target = root / path
              if not target.exists():
                  assert path == '.github/workflows/repair-workbench.yml'
                  tree.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              sha = hash_blob(target.read_bytes())
              mode = '100755' if target.stat().st_mode & 0o111 else '100644'
              tree.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': sha})
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          assert parent == os.environ['REPAIR_HEAD']
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}']).decode().strip()
          manifest = {'parent': parent, 'base_tree': base_tree, 'entries': tree}
          (out / 'TREE.json').write_text(json.dumps(manifest, indent=2))
          (out / 'repair.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary']))
          with tarfile.open(out / 'source.tar.gz', 'w:gz') as archive:
              for path in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
                  if path: archive.add(path, arcname=path, recursive=False)
          print(json.dumps(manifest, indent=2))
          PY
      - name: Upload reviewed-source candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2wlan-complete-repair-${{ github.event.pull_request.head.sha }}
          path: /tmp/p2wlan-complete-repair/
          retention-days: 7
      - name: Targeted Rust regression tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p p2wlan-daemon --lib diagnostics:: -- --test-threads=1
          cargo test -p p2wlan-daemon --lib shutdown_reliability_tests -- --test-threads=1
      - name: Flutter regression tests
        if: always()
        working-directory: apps/flutter_client
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test test/reliability_regression_test.dart test/log_presentation_test.dart
      - name: Log parser compatibility
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dual-end/test-log-format-compatibility.py
          python3 scripts/dual-end/test-production-availability-parser.py
