name: Temporary Include Format Committer

on:
  push:
    branches: [chore/include-format-export-20260917]

permissions:
  contents: write

concurrency:
  group: temporary-include-format-committer
  cancel-in-progress: true

jobs:
  commit_format_fix:
    name: Format and commit inherited include sources
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install repository Rustfmt
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt

      - name: Format every inherited drift entry
        shell: bash
        run: |
          set -euo pipefail
          edition="$(python3 - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from scripts.quality.check_include_format import workspace_edition
          print(workspace_edition())
          PY
          )"
          while read -r kind path; do
            [[ "$kind" == drift ]] || continue
            rustfmt --edition "$edition" "$path"
          done < <(grep -E '^(drift|fragment) ' scripts/quality/include_format_baseline.txt)
          python3 scripts/quality/check_include_format.py --update-baseline
          python3 scripts/quality/check_include_format.py
          git diff --check
          test "$(grep -c '^drift ' scripts/quality/include_format_baseline.txt || true)" -eq 0
          test "$(grep -c '^fragment ' scripts/quality/include_format_baseline.txt || true)" -eq 1
          test "$(git diff --name-only | wc -l | tr -d ' ')" -eq 167

      - name: Restore permanent CI and create the source-only commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" -eq 168
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client scripts/quality/include_format_baseline.txt .github/workflows/ci.yml
          git commit -m 'chore:清零 include! Rust 格式历史漂移'
          git push origin "HEAD:${GITHUB_REF_NAME}"
