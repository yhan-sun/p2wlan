name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            xdotool \
            patchelf
      - name: Rust Fmt Check
        run: cargo fmt --all --check
      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust Tests (general suite)
        run: cargo test --workspace --all-targets -- --test-threads=1 --skip hard_hard_
      - name: Rust Tests (Hard↔Hard isolated suite)
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p p2wlan-daemon --lib --no-run
          hard_hard_binary="$(find target/debug/deps -maxdepth 1 -type f -name 'p2pnet_daemon-*' -perm -111 -print0 | xargs -0 ls -t | head -n 1)"
          if [ -z "$hard_hard_binary" ]; then
            echo "Hard↔Hard test binary was not built" >&2
            exit 1
          fi
          hard_hard_tests="$("$hard_hard_binary" hard_hard_ --list | sed -n 's/: test$//p')"
          test_count="$(printf '%s\n' "$hard_hard_tests" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$test_count" -eq 0 ]; then
            echo "No Hard↔Hard tests discovered" >&2
            exit 1
          fi
          while IFS= read -r test_name; do
            [ -n "$test_name" ] || continue
            "$hard_hard_binary" "$test_name" --exact --test-threads=1
          done <<< "$hard_hard_tests"
      - name: Linux route gate tests
        run: "cargo test -p p2wlan-daemon --lib route::tests::"
      - name: Rust Linux Target Cross-Compile Check
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo check --target x86_64-unknown-linux-gnu
      - name: Build Identity Gate
        # The built daemon must report the exact commit CI checked out, and
        # --version must carry that commit too. A drift here means
        # /status.version could no longer prove which build is running.
        run: |
          cargo build -p p2wlan-daemon
          HEAD_SHA="$(git rev-parse HEAD)"
          IDENTITY_JSON="$(target/debug/p2wlan-daemon --build-info)"
          IDENTITY_SHA="$(printf '%s' "$IDENTITY_JSON" | sed -n 's/.*"git_commit": "\([^"]*\)".*/\1/p' | head -1)"
          if [[ "$IDENTITY_SHA" != "$HEAD_SHA" ]]; then
            echo "build identity mismatch: daemon=$IDENTITY_SHA checkout=$HEAD_SHA" >&2
            exit 1
          fi
          target/debug/p2wlan-daemon --version | grep -q "$HEAD_SHA" || {
            echo "--version must embed the git commit" >&2
            exit 1
          }
          BIN_SHA="$(shasum -a 256 target/debug/p2wlan-daemon | awk '{print $1}')"
          REPORTED_SHA="$(printf '%s' "$IDENTITY_JSON" | sed -n 's/.*"binary_sha256": "\([^"]*\)".*/\1/p' | head -1)"
          if [[ "$BIN_SHA" != "$REPORTED_SHA" ]]; then
            echo "binary_sha256 mismatch: reported=$REPORTED_SHA actual=$BIN_SHA" >&2
            exit 1
          fi
          echo "build identity gate PASS (commit=$HEAD_SHA sha=$BIN_SHA)"

  rust_windows:
    name: Rust Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust Clippy (Windows)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust Fmt Check (Windows)
        run: cargo fmt --all -- --check
      - name: Rust Tests (Windows, general suite)
        run: cargo test --workspace -- --test-threads=1 --skip hard_hard_
      - name: Rust Tests (Windows, Hard↔Hard isolated suite)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test -p p2wlan-daemon --lib --no-run
          $hardHardBinary = Get-ChildItem -Path 'target/debug/deps' -Filter 'p2pnet_daemon-*.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $hardHardBinary) {
            throw 'Hard↔Hard test binary was not built'
          }
          $hardHardTests = @(& $hardHardBinary.FullName hard_hard_ --list |
            Where-Object { $_ -match ': test$' } |
            ForEach-Object { $_ -replace ': test$', '' })
          if ($hardHardTests.Count -eq 0) {
            throw 'No Hard↔Hard tests discovered'
          }
          foreach ($testName in $hardHardTests) {
            & $hardHardBinary.FullName $testName --exact --test-threads=1
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

  go:
    name: Go Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go Vet
        working-directory: server
        run: go vet ./...
      - name: Go Test
        working-directory: server
        run: go test ./... -count=1

  repository_policy:
    name: React absence and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert web GUI dependencies are absent
        run: |
          test ! -e package.json
          test ! -e pnpm-lock.yaml
          test ! -e pnpm-workspace.yaml
          test ! -e vite.config.ts
      - name: Scan for deleted React/Vite origins
        run: |
          legacy_port=327
          if git grep -nE "react-dom|from [\"']react[\"']|@vitejs|vite/client|pnpm run|localhost:14${legacy_port}" -- . ':!docs/**' ':!*.md' ':!.github/workflows/**'; then
            echo "deleted React/Vite/legacy-origin reference found" >&2
            exit 1
          fi
      - name: Scan production credential transport
        run: |
          if git grep -nE 'localStorage|sessionStorage|--token([ =]|$)|p2wlan-daemon\.token' -- \
            'apps/flutter_client/lib/**' \
            'client/**' \
            'scripts/**' \
            ':!scripts/dual-end/mini-air-smoke.sh'; then
            echo "unsafe production credential transport found" >&2
            exit 1
          fi

  required:
    name: CI Required
    if: always()
    needs: [rust, rust_windows, go, repository_policy]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required job results
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.rust_windows.result }}" = "success"
          test "${{ needs.go.result }}" = "success"
          test "${{ needs.repository_policy.result }}" = "success"
          echo "all required CI jobs succeeded"
