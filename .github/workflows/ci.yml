name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            xdotool \
            patchelf
      - name: Rust Fmt Check
        run: cargo fmt --all --check
      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust Tests
        run: cargo test --workspace --all-targets
      - name: Rust Linux Target Cross-Compile Check
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo check --target x86_64-unknown-linux-gnu
      - name: Build Identity Gate
        # The built daemon must report the exact commit CI checked out, and
        # --version must carry that commit too.  A drift here means /status.version
        # could no longer prove which build is running.
        run: |
          cargo build -p p2wlan-daemon
          HEAD_SHA="$(git rev-parse HEAD)"
          IDENTITY_JSON="$(target/debug/p2wlan-daemon --build-info)"
          IDENTITY_SHA="$(printf '%s' "$IDENTITY_JSON" | sed -n 's/.*"git_commit": "\([^"]*\)".*/\1/p' | head -1)"
          if [[ "$IDENTITY_SHA" != "$HEAD_SHA" ]]; then
            echo "build identity mismatch: daemon=$IDENTITY_SHA checkout=$HEAD_SHA" >&2
            exit 1
          fi
          target/debug/p2wlan-daemon --version | grep -q "$HEAD_SHA" || {
            echo "--version must embed the git commit" >&2
            exit 1
          }
          BIN_SHA="$(shasum -a 256 target/debug/p2wlan-daemon | awk '{print $1}')"
          REPORTED_SHA="$(printf '%s' "$IDENTITY_JSON" | sed -n 's/.*"binary_sha256": "\([^"]*\)".*/\1/p' | head -1)"
          if [[ "$BIN_SHA" != "$REPORTED_SHA" ]]; then
            echo "binary_sha256 mismatch: reported=$REPORTED_SHA actual=$BIN_SHA" >&2
            exit 1
          fi
          echo "build identity gate PASS (commit=$HEAD_SHA sha=$BIN_SHA)"

  rust-windows:
    name: Rust Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust Clippy (Windows)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust Tests (Windows)
        # The daemon lib tests cover the platform-specific directory-fsync
        # path (incarnation persistence) and the full signal/lease flow on
        # Windows; desktop/TUN crates are excluded because Windows builds of
        # the TUN dataplane need admin privileges for packet tests.
        run: |
          cargo test -p p2wlan-daemon --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p p2pnet-nat --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  go:
    name: Go Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go Vet
        run: |
          cd server
          go vet ./...
      - name: Go Test
        run: |
          cd server
          go test ./... -count=1
