name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            xdotool \
            patchelf
      - name: Rust Fmt Check
        run: cargo fmt --all --check
      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust Tests
        run: cargo test --workspace --all-targets
      - name: Rust Linux Target Cross-Compile Check
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo check --target x86_64-unknown-linux-gnu

  rust-windows:
    name: Rust Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust Clippy (Windows)
        run: cargo clippy --workspace --exclude p2wlan-desktop --all-targets --all-features -- -D warnings
      - name: Rust Tests (Windows)
        # The daemon lib tests cover the platform-specific directory-fsync
        # path (incarnation persistence) and the full signal/lease flow on
        # Windows; desktop/TUN crates are excluded because Windows builds of
        # the TUN dataplane need admin privileges for packet tests.
        run: cargo test -p p2wlan-daemon --lib -p p2pnet-nat --lib

  go:
    name: Go Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go Vet
        run: |
          cd server
          go vet ./...
      - name: Go Test
        run: |
          cd server
          go test ./... -count=1

  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.15.1
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level high
      - name: Build
        run: pnpm run build
