name: Format mobile lifecycle changes

on:
  push:
    branches:
      - test/mobile-lifecycle-v2-20260828
    paths:
      - ".github/workflows/format-mobile-lifecycle.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/mobile-lifecycle-v2-20260828
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: apps/flutter_client
        run: flutter pub get
      - name: Restore SDK-managed files and format mobile changes
        run: |
          set -euo pipefail
          bash scripts/release/hermetic_build.sh restore
          cd apps/flutter_client
          dart format \
            lib/core/state/status_store.dart \
            test/status_store_test.dart
          dart format --output=none --set-exit-if-changed \
            lib/core/state/status_store.dart \
            test/status_store_test.dart
      - name: Commit formatted mobile files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/flutter_client/lib/core/state/status_store.dart \
            apps/flutter_client/test/status_store_test.dart
          git diff --cached --quiet && { echo "files were already formatted"; exit 0; }
          git commit -m "style(mobile): format lifecycle regression"
          git push origin HEAD:test/mobile-lifecycle-v2-20260828
