name: Build and stage server

on:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Upload the verified server bundle to the isolated staging host
        required: true
        default: false
        type: boolean
      ref:
        description: Source ref to build (tag or commit; defaults to the checked-out ref)
        required: false
        type: string
      deployment_mode:
        description: Staging action after a successful build
        required: true
        default: smoke-upload
        type: choice
        options:
          - smoke-upload
          - install-upload
  push:
    tags:
      - 'server-v*'

permissions:
  contents: read

env:
  GO_VERSION_FILE: server/go.mod

jobs:
  build:
    name: Build server (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: server/admin-ui/package-lock.json

      - name: Build embedded admin UI
        working-directory: server/admin-ui
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          python3 ../../scripts/quality/check_admin_assets.py ../admin/web

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
          cache-dependency-path: server/go.sum

      - name: Test server
        working-directory: server
        run: go test ./...

      - name: Build and checksum server bundle
        id: bundle
        working-directory: server
        env:
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/server-v') && github.ref_name || format('server-dev-{0}', github.sha) }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == server-dev-* ]]; then VERSION="server-dev-$SOURCE_SHA"; fi
          rm -rf dist
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -trimpath \
            -ldflags="-s -w -X main.buildVersion=$VERSION -X main.buildCommit=$SOURCE_SHA" \
            -o dist/p2wlan-control .
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -trimpath \
            -ldflags="-s -w -X main.buildVersion=$VERSION -X main.buildCommit=$SOURCE_SHA" \
            -o dist/p2wlan-relay ./relay
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -trimpath -o dist/p2wlan-config ./cmd/p2wlan-config
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -trimpath -o dist/p2wlan-db ./cmd/p2wlan-db
          chmod 0755 dist/p2wlan-control dist/p2wlan-relay dist/p2wlan-config dist/p2wlan-db
          {
            echo "version=$VERSION"
            echo "commit=$SOURCE_SHA"
            echo "arch=$GOARCH"
            go version
            go version -m dist/p2wlan-control
            go version -m dist/p2wlan-relay
          } > dist/BUILD-METADATA.txt
          (
            cd dist
            sha256sum p2wlan-control p2wlan-relay p2wlan-config p2wlan-db > SHA256SUMS
          )
          install -m 0755 ../scripts/p2wlan-server ../scripts/install-server.sh ../scripts/deploy-server.sh dist/
          tar -C dist -czf "p2wlan-server-linux-${{ matrix.arch }}.tar.gz" \
            p2wlan-control p2wlan-relay p2wlan-config p2wlan-db p2wlan-server install-server.sh deploy-server.sh BUILD-METADATA.txt SHA256SUMS
          sha256sum "p2wlan-server-linux-${{ matrix.arch }}.tar.gz" > \
            "p2wlan-server-linux-${{ matrix.arch }}.tar.gz.sha256"

      - name: Upload server bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p2wlan-server-linux-${{ matrix.arch }}-${{ steps.bundle.outputs.source_sha }}
          path: |
            server/p2wlan-server-linux-${{ matrix.arch }}.tar.gz
            server/p2wlan-server-linux-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 14

  source:
    name: Package fixed server source
    if: ${{ startsWith(github.ref, 'refs/tags/server-v') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test source packaging boundaries
        run: python3 -m unittest scripts.selfhost.test_server_source
      - name: Package committed source and deployment files
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/selfhost/package_server_source.py \
            --repo-root . --source-sha "$GITHUB_SHA" --version "$VERSION" \
            --output-dir source-assets
      - name: Install and repeat the packaged source deployment
        env:
          P2WLAN_VERSION: ${{ github.ref_name }}
          P2WLAN_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir source-tree
          tar -xzf source-assets/p2wlan-server-source.tar.gz -C source-tree
          bash source-tree/scripts/install-server-docker.sh --source "$PWD/source-tree" \
            --dir "$RUNNER_TEMP/p2wlan-source-plan" --dev-localhost --dry-run
          deployment="$RUNNER_TEMP/source-install"
          test ! -e "$deployment"
          installer="$PWD/source-tree/scripts/install-server-docker.sh"
          sudo bash "$installer" --source "$PWD/source-tree" --dev-localhost \
            --non-interactive --dir "$deployment" --wait-timeout 120
          # Read only the public image identity; never dump the environment files.
          image_id=$(sudo awk -F= '$1 == "P2WLAN_IMAGE" { count++; image=$2 } END { if (count != 1) exit 1; print image }' "$deployment/.env")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(sudo docker image inspect "$image_id" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$P2WLAN_VERSION"
          test "$(sudo docker image inspect "$image_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$P2WLAN_COMMIT"
          for component in control relay; do
            actual=$(sudo docker run --rm --entrypoint "/usr/local/bin/p2wlan-$component" "$image_id" --version)
            test "$actual" = "p2wlan-$component $P2WLAN_VERSION ($P2WLAN_COMMIT)"
          done
          compose=(sudo docker compose --env-file "$deployment/.env" -f "$deployment/compose.yml")
          check_health() {
            curl -fsS --connect-timeout 3 --max-time 10 --output /dev/null http://127.0.0.1:18080/health
            "${compose[@]}" exec -T relay curl -fsS --connect-timeout 3 --max-time 10 \
              --output /dev/null http://127.0.0.1:18082/readyz
          }
          check_health
          fingerprints="$RUNNER_TEMP/source-install-credentials.sha256"
          sudo sha256sum "$deployment/config/control.env" "$deployment/config/relay.env" \
            "$deployment/config/tls.crt" "$deployment/config/tls.key" > "$fingerprints"
          "${compose[@]}" down --remove-orphans
          sudo bash "$installer" --source "$PWD/source-tree" --dev-localhost \
            --non-interactive --dir "$deployment" --wait-timeout 120
          sudo sha256sum --check --status "$fingerprints"
          check_health
          echo 'PASS: packaged source installed, remained healthy, and preserved credentials on repeat deployment'
      - name: Always stop the source installer fixture
        if: ${{ always() }}
        run: |
          set -euo pipefail
          deployment="$RUNNER_TEMP/source-install"
          if sudo test -f "$deployment/.env" && sudo test -f "$deployment/compose.yml"; then
            sudo docker compose --env-file "$deployment/.env" -f "$deployment/compose.yml" down --remove-orphans
          fi
      - name: Upload fixed source bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p2wlan-server-source-${{ github.sha }}
          path: source-assets/*
          if-no-files-found: error
          retention-days: 14

  image:
    name: Publish fixed server image
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/server-v') && vars.SERVER_PUBLISH_IMAGE == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve image identity
        id: identity
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^server-v[A-Za-z0-9._-]+$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/server" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish multi-platform image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            COMMIT=${{ steps.identity.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            org.opencontainers.image.revision=${{ steps.identity.outputs.commit }}
            org.opencontainers.image.licenses=MIT
          tags: |
            ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.version }}
            ${{ steps.identity.outputs.image }}:sha-${{ steps.identity.outputs.commit }}
          provenance: true
          sbom: true

      - name: Verify published platform identities
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > published-index.json
          for platform in linux/amd64 linux/arm64; do
            # Classic Docker storage cannot keep both architectures under one
            # index digest. Resolve each child from the exact published index
            # and run that immutable manifest without replacing the other.
            platform_digest=$(jq -er --arg arch "${platform#linux/}" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
              | if length == 1 then .[0].digest else error("expected one platform manifest") end
            ' published-index.json)
            [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            for component in control relay; do
              actual=$(docker run --rm --platform "$platform" \
                --entrypoint "/usr/local/bin/p2wlan-$component" "$IMAGE@$platform_digest" --version)
              test "$actual" = "p2wlan-$component $VERSION ($SOURCE_SHA)"
            done
          done

      - name: Write immutable image deployment metadata
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ steps.identity.outputs.commit }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          image, digest = os.environ['IMAGE'], os.environ['DIGEST']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('invalid published image digest')
          directory = pathlib.Path('image-assets')
          directory.mkdir()
          reference = image + '@' + digest
          metadata = {
              'schema_version': 1,
              'version': os.environ['VERSION'],
              'source_sha': os.environ['SOURCE_SHA'],
              'image': reference,
              'digest': digest,
              'platforms': ['linux/amd64', 'linux/arm64'],
          }
          manifest = directory / 'SERVER-IMAGE.json'
          manifest.write_text(json.dumps(metadata, indent=2) + '\n')
          checksum = hashlib.sha256(manifest.read_bytes()).hexdigest()
          (directory / 'SERVER-IMAGE.json.sha256').write_text(checksum + '  SERVER-IMAGE.json\n')
          print('Fixed deployment image: ' + reference)
          PY

      - name: Package Docker deployment entry point
        run: |
          set -euo pipefail
          mkdir -p docker-deployment
          install -m 0755 scripts/install-server-docker.sh docker-deployment/install-server-docker.sh
          install -m 0644 deploy/selfhost/compose.production.yml docker-deployment/compose.production.yml
          install -m 0644 image-assets/SERVER-IMAGE.json image-assets/SERVER-IMAGE.json.sha256 docker-deployment/
          COPYFILE_DISABLE=1 tar -C docker-deployment -czf image-assets/p2wlan-server-docker.tar.gz \
            install-server-docker.sh compose.production.yml SERVER-IMAGE.json SERVER-IMAGE.json.sha256
          (cd image-assets && sha256sum p2wlan-server-docker.tar.gz > p2wlan-server-docker.tar.gz.sha256)

      - name: Upload immutable image deployment metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p2wlan-server-image-${{ github.sha }}
          path: image-assets/*
          if-no-files-found: error
          retention-days: 14

  stage:
    name: Deploy verified bundle to staging
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_staging }}
    runs-on: ubuntu-22.04
    environment: staging
    concurrency:
      group: p2wlan-server-staging
      cancel-in-progress: false
    steps:
      - name: Resolve exact source SHA
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Record staging source
        id: source-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download built bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: p2wlan-server-linux-*-${{ steps.source-sha.outputs.sha }}
          path: bundles
          merge-multiple: true

      - name: Verify bundles match exact source
        env:
          EXPECTED_SHA: ${{ steps.source-sha.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(find bundles -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          for archive in bundles/*.tar.gz; do
            checksum="$archive.sha256"
            test -f "$checksum"
            (cd bundles && sha256sum -c "$(basename "$checksum")")
            actual_sha="$(tar -xOf "$archive" BUILD-METADATA.txt | awk -F= '/^commit=/{print $2; exit}')"
            test "$actual_sha" = "$EXPECTED_SHA" || {
              echo "bundle source mismatch: archive=$archive expected=$EXPECTED_SHA actual=$actual_sha" >&2
              exit 1
            }
          done

      - name: Check staging SSH inputs
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_USER: ${{ vars.STAGING_USER }}
        run: |
          set -euo pipefail
          test -n "$STAGING_SSH_PRIVATE_KEY"
          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"
          case "$STAGING_HOST" in
            ''|*[!A-Za-z0-9._:-]*) echo "STAGING_HOST contains unsupported characters" >&2; exit 1 ;;
          esac

      - name: Install SSH key and fixed host key
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/p2wlan-staging"
          chmod 600 "$HOME/.ssh/p2wlan-staging"
          test -n "$STAGING_KNOWN_HOSTS"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact built bundle
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_USER: ${{ vars.STAGING_USER }}
          STAGING_PORT: ${{ vars.STAGING_PORT || '22' }}
          STAGING_MODE: ${{ inputs.deployment_mode || 'smoke-upload' }}
          EXPECTED_SHA: ${{ steps.source-sha.outputs.sha }}
        run: |
          set -euo pipefail
          bundle_dir="/tmp/p2wlan-staging-${GITHUB_RUN_ID}"
          ssh_cmd=(ssh -i "$HOME/.ssh/p2wlan-staging" -p "$STAGING_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$STAGING_USER@$STAGING_HOST")
          case "$STAGING_MODE" in
            smoke-upload|install-upload) ;;
            *) echo "unsupported STAGING_MODE=$STAGING_MODE" >&2; exit 1 ;;
          esac
          "${ssh_cmd[@]}" "umask 077; mkdir -p '$bundle_dir'"
          scp -i "$HOME/.ssh/p2wlan-staging" -P "$STAGING_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            bundles/* scripts/staging/run-server-smoke.sh "$STAGING_USER@$STAGING_HOST:$bundle_dir/"
          "${ssh_cmd[@]}" bash -s -- "$bundle_dir" "$EXPECTED_SHA" <<'REMOTE_VERIFY'
          set -euo pipefail
          bundle_dir=$1
          expected_sha=$2
          cd "$bundle_dir"
          chmod 0755 run-server-smoke.sh
          for checksum in *.tar.gz.sha256; do sha256sum -c "$checksum"; done
          for archive in *.tar.gz; do
            actual_sha="$(tar -xOf "$archive" BUILD-METADATA.txt | awk -F= '/^commit=/{print $2; exit}')"
            test "$actual_sha" = "$expected_sha" || {
              echo "uploaded bundle source mismatch: $archive expected=$expected_sha actual=$actual_sha" >&2
              exit 1
            }
          done
          REMOTE_VERIFY

          if [ "$STAGING_MODE" = smoke-upload ]; then
            "${ssh_cmd[@]}" "cd '$bundle_dir'; ./run-server-smoke.sh '$bundle_dir' '$GITHUB_RUN_ID'"
          else
            "${ssh_cmd[@]}" "sudo -n true"
            "${ssh_cmd[@]}" bash -s -- "$bundle_dir" "$EXPECTED_SHA" <<'REMOTE_INSTALL'
          set -euo pipefail
          bundle_dir=$1
          expected_sha=$2
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported staging architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="$bundle_dir/p2wlan-server-linux-$arch.tar.gz"
          checksum="$archive.sha256"
          (cd "$bundle_dir" && sha256sum -c "$(basename "$checksum")")
          actual_sha="$(tar -xOf "$archive" BUILD-METADATA.txt | awk -F= '/^commit=/{print $2; exit}')"
          test "$actual_sha" = "$expected_sha"
          tar -xOf "$archive" p2wlan-server > "$bundle_dir/p2wlan-server"
          tar -xOf "$archive" install-server.sh > "$bundle_dir/install-server.sh"
          chmod 0755 "$bundle_dir/p2wlan-server" "$bundle_dir/install-server.sh"
          if [ -e /opt/p2wlan-server/current ]; then
            sudo -n install -m 0755 "$bundle_dir/p2wlan-server" /usr/local/bin/p2wlan-server
            sudo -n p2wlan-server update --archive "$archive"
          else
            sudo -n "$bundle_dir/install-server.sh" --archive "$archive" --role all
          fi
          sudo -n p2wlan-server verify --service all
          sudo -n p2wlan-server start --service all
          sudo -n p2wlan-server check --service all
          installed_sha="$(sudo -n tar -xOf "$archive" BUILD-METADATA.txt | awk -F= '/^commit=/{print $2; exit}')"
          test "$installed_sha" = "$expected_sha"
          REMOTE_INSTALL
          fi

      - name: Remove staging upload
        if: ${{ always() }}
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_USER: ${{ vars.STAGING_USER }}
          STAGING_PORT: ${{ vars.STAGING_PORT || '22' }}
        run: |
          set -euo pipefail
          if [ -n "${STAGING_HOST:-}" ] && [ -n "${STAGING_USER:-}" ] && [ -f "$HOME/.ssh/p2wlan-staging" ]; then
            ssh -i "$HOME/.ssh/p2wlan-staging" -p "$STAGING_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$STAGING_USER@$STAGING_HOST" "rm -rf '/tmp/p2wlan-staging-${GITHUB_RUN_ID}'" || true
          fi

  release:
    name: Publish native and source server release
    needs: [build, source]
    if: ${{ startsWith(github.ref, 'refs/tags/server-v') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: p2wlan-server-linux-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Download fixed source bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: p2wlan-server-source-${{ github.sha }}
          path: release-assets
      - name: Verify release assets
        working-directory: release-assets
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for checksum in *.tar.gz.sha256; do sha256sum -c "$checksum"; done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          for arch in amd64 arm64; do
            archive="p2wlan-server-linux-$arch.tar.gz"
            test -f "$archive"
            actual_sha="$(tar -xOf "$archive" BUILD-METADATA.txt | awk -F= '/^commit=/{print $2; exit}')"
            test "$actual_sha" = "$EXPECTED_SHA"
            test "$(tar -xOf "$archive" BUILD-METADATA.txt | awk -F= '/^version=/{print $2; exit}')" = "$GITHUB_REF_NAME"
            test "$(tar -xOf "$archive" BUILD-METADATA.txt | awk -F= '/^arch=/{print $2; exit}')" = "$arch"
          done
          python3 - <<'PY_SOURCE'
          import hashlib, json, os, pathlib, re, tarfile
          with tarfile.open('p2wlan-server-source.tar.gz') as archive:
              members = archive.getmembers()
              names = {m.name for m in members}
              assert len(names) == len(members) <= 4098
              assert all(m.isfile() and 0 <= m.size <= 64 * 1024 * 1024 for m in members)
              assert sum(m.size for m in members) <= 256 * 1024 * 1024
              assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in names)
              assert archive.getmember('SERVER-SOURCE.json').size <= 1024 * 1024
              raw = archive.extractfile('SERVER-SOURCE.json').read()
              metadata = json.loads(raw)
              assert metadata['schema_version'] == 1 and metadata['context'] == 'server'
              assert metadata['version'] == os.environ['GITHUB_REF_NAME']
              assert metadata['source_sha'] == os.environ['EXPECTED_SHA']
              files = metadata['files']
              assert names == set(files) | {'SERVER-SOURCE.json', 'SERVER-SOURCE.json.sha256'}
              required = {'server/Dockerfile', 'server/.dockerignore', 'server/go.mod', 'server/go.sum',
                          'server/admin-ui/package.json', 'server/admin-ui/package-lock.json',
                          'scripts/install-server-docker.sh', 'deploy/selfhost/compose.production.yml',
                          'deploy/selfhost/compose.build.yml'}
              assert required.issubset(files)
              assert sum(archive.getmember(n).size for n in files) <= 256 * 1024 * 1024
              for name, digest in files.items():
                  assert re.fullmatch(r'[0-9a-f]{64}', digest)
                  assert hashlib.sha256(archive.extractfile(name).read()).hexdigest() == digest
              checksum = hashlib.sha256(raw).hexdigest() + '  SERVER-SOURCE.json\n'
              assert archive.extractfile('SERVER-SOURCE.json.sha256').read() == checksum.encode('ascii')
          PY_SOURCE
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest=false

  image_release:
    name: Append optional prebuilt image deployment assets
    needs: [release, image]
    if: ${{ startsWith(github.ref, 'refs/tags/server-v') && vars.SERVER_PUBLISH_IMAGE == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download verified image deployment metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: p2wlan-server-image-${{ github.sha }}
          path: release-assets
      - name: Verify optional image assets
        working-directory: release-assets
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha256sum -c p2wlan-server-docker.tar.gz.sha256
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, tarfile
          manifest = pathlib.Path('SERVER-IMAGE.json')
          metadata = json.loads(manifest.read_text())
          expected_repository = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower() + '/server'
          assert metadata['schema_version'] == 1
          assert metadata['source_sha'] == os.environ['EXPECTED_SHA']
          assert metadata['version'] == os.environ['GITHUB_REF_NAME']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', metadata['digest'])
          assert metadata['image'] == expected_repository + '@' + metadata['digest']
          assert metadata['platforms'] == ['linux/amd64', 'linux/arm64']
          checksum = hashlib.sha256(manifest.read_bytes()).hexdigest()
          assert pathlib.Path('SERVER-IMAGE.json.sha256').read_text() == checksum + '  SERVER-IMAGE.json\n'
          with tarfile.open('p2wlan-server-docker.tar.gz') as bundle:
              members = bundle.getmembers()
              assert len(members) == 4
              assert {m.name for m in members} == {'install-server-docker.sh', 'compose.production.yml', 'SERVER-IMAGE.json', 'SERVER-IMAGE.json.sha256'}
              assert all(m.isfile() for m in members)
              assert bundle.extractfile('SERVER-IMAGE.json').read() == manifest.read_bytes()
              assert bundle.extractfile('SERVER-IMAGE.json.sha256').read() == pathlib.Path('SERVER-IMAGE.json.sha256').read_bytes()
          PY
      - name: Verify anonymous access to the exact published image
        working-directory: release-assets
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import signal
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          class VerificationError(Exception):
              pass

          def deadline(*_):
              raise VerificationError('anonymous registry verification exceeded its 90-second deadline')

          signal.signal(signal.SIGALRM, deadline)
          signal.alarm(90)
          # Do not use Docker, its login configuration, or GITHUB_TOKEN. This
          # independent client must have exactly the access a fresh VPS has.
          client = urllib.request.build_opener(urllib.request.ProxyHandler({}))

          def fetch(url, *, accept, bearer=None, limit=4 * 1024 * 1024):
              headers = {'Accept': accept, 'Accept-Encoding': 'identity',
                         'User-Agent': 'p2wlan-release-anonymous-check'}
              if bearer is not None:
                  headers['Authorization'] = 'Bearer ' + bearer
              request = urllib.request.Request(url, headers=headers)
              try:
                  with client.open(request, timeout=30) as response:
                      content = response.read(limit + 1)
                      if len(content) > limit:
                          raise VerificationError('anonymous registry response exceeded its size limit')
                      return content, response.headers
              except urllib.error.HTTPError as error:
                  status = error.code
                  error.close()
                  raise VerificationError(f'anonymous GHCR request returned HTTP {status}') from None

          try:
              metadata = json.loads(Path('SERVER-IMAGE.json').read_text())
              image, digest = metadata['image'], metadata['digest']
              match = re.fullmatch(r'ghcr\.io/([a-z0-9][a-z0-9._/-]*)@(sha256:[a-f0-9]{64})', image)
              if not match or match[2] != digest:
                  raise VerificationError('release image is not an exact GHCR digest')
              repository = match[1]
              query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': f'repository:{repository}:pull'})
              content, _ = fetch('https://ghcr.io/token?' + query, accept='application/json', limit=64 * 1024)
              credentials = json.loads(content)
              bearer = credentials.get('token') or credentials.get('access_token')
              if not isinstance(bearer, str) or not bearer:
                  raise VerificationError('GHCR did not issue an anonymous pull token')
              index_types = ('application/vnd.oci.image.index.v1+json',
                             'application/vnd.docker.distribution.manifest.list.v2+json')
              content, headers = fetch(f'https://ghcr.io/v2/{repository}/manifests/{digest}',
                                       accept=', '.join(index_types), bearer=bearer)
              if headers.get('Docker-Content-Digest') != digest:
                  raise VerificationError('anonymous image response digest does not match the release')
              if 'sha256:' + hashlib.sha256(content).hexdigest() != digest:
                  raise VerificationError('anonymous image index bytes do not match the release digest')
              index = json.loads(content)
              if (headers.get('Content-Type', '').split(';', 1)[0] not in index_types
                      or index.get('schemaVersion') != 2 or index.get('mediaType') not in index_types):
                  raise VerificationError('anonymous image response is not a multi-platform index')
              platforms = {(item.get('platform', {}).get('os'), item.get('platform', {}).get('architecture'))
                           for item in index.get('manifests', [])}
              if not {('linux', 'amd64'), ('linux', 'arm64')}.issubset(platforms):
                  raise VerificationError('anonymous image index is missing linux/amd64 or linux/arm64')
              print('PASS: anonymous GHCR access verified for the exact digest and both Linux platforms')
          except (VerificationError, OSError, ValueError, KeyError, TypeError, AttributeError) as error:
              print('::error::Cannot append optional prebuilt image assets: ' + str(error), file=sys.stderr)
              print('The exact GHCR image digest must be publicly readable without Docker login. '
                    'Check registry access, set the package visibility to public if needed, '
                    'then rerun this optional image release job. The source Release is independent.', file=sys.stderr)
              sys.exit(1)
          finally:
              signal.alarm(0)
          PY
      - name: Append prebuilt image assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY"
