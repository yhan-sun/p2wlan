name: Daemon refactor workbench

on:
  push:
    branches: [refactor/daemon-owned-components]
    paths:
      - .github/workflows/daemon-refactor-workbench.yml
      - scripts/quality/refactor_daemon.py

permissions:
  contents: read

concurrency:
  group: daemon-refactor-workbench
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'yhan-sun/p2wlan'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Prepare public compiler and locked dependency sources
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/daemon-refactor-tools"
          staging="$RUNNER_TEMP/daemon-refactor-staging"
          mkdir -p "$output" "$staging/rust" "$staging/wheels"
          sysroot="$(rustc --print sysroot)"
          cp -a "$sysroot/bin" "$sysroot/lib" "$staging/rust/"
          cargo vendor --locked --versioned-dirs "$staging/vendor" > "$staging/vendor-config.toml"
          python3 -m pip download --only-binary=:all: --python-version 3.13 --implementation cp --abi cp313 --platform manylinux2014_x86_64 --dest "$staging/wheels" tree-sitter==0.26.0 tree-sitter-rust
          rustc --version > "$staging/compiler-version.txt"
          git rev-parse HEAD > "$staging/source-commit.txt"
          tar -C "$staging" -czf "$output/tools.tar.gz" .
          sha256sum "$output/tools.tar.gz" > "$output/tools.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daemon-refactor-tools-${{ github.sha }}
          path: ${{ runner.temp }}/daemon-refactor-tools/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
