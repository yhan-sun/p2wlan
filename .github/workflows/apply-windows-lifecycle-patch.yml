name: Apply Windows Lifecycle Patch

on:
  push:
    branches:
      - fix/windows-graceful-lifecycle-20260828
    paths:
      - ".github/workflows/apply-windows-lifecycle-patch.yml"

permissions:
  contents: write

concurrency:
  group: apply-windows-lifecycle-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-graceful-lifecycle-20260828
          fetch-depth: 0

      - name: Apply exact source transformations
        run: python3 scripts/dev/apply_windows_lifecycle_patch.py

      - name: Set up Flutter formatter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format and validate patch
        run: |
          dart format \
            apps/flutter_client/lib/core/daemon/daemon_controller.dart \
            apps/flutter_client/test/windows_binary_probe_integration_test.dart
          git diff --check

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/dev/apply_windows_lifecycle_patch.py
          rm .github/workflows/apply-windows-lifecycle-patch.yml
          rmdir scripts/dev 2>/dev/null || true

      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(windows): allow graceful daemon shutdown budget"
          git push origin HEAD:fix/windows-graceful-lifecycle-20260828
