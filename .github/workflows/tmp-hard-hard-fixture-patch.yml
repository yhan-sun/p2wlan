name: Temporary Hard-Hard fixture patch

on:
  push:
    branches:
      - tmp/hard-hard-fixture-patch-20260905

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: tmp/hard-hard-fixture-patch-20260905
          fetch-depth: 1
      - name: Patch isolated scheduler targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("client/daemon/src/lib/tests/part07.rs")
          text = path.read_text()
          marker = "bind isolated Birthday scheduler sink"
          if marker not in text:
              test_start = text.index(
                  'async fn hard_hard_birthday_levels_report_requested_and_actual_socket_counts()'
              )
              install_start = text.index(
                  'install_direct_scheduler_birthday_session(', test_start
              )
              scheduler_start = text.index('let scheduler_report = harness', install_start)
              indent = text[text.rfind('\n', 0, scheduler_start) + 1:scheduler_start]
              block = (
                  f'{indent}// This case validates production scheduler accounting, not peer\n'
                  f'{indent}// convergence. Keep its targets on owned sink sockets so the\n'
                  f'{indent}// synthetic NAT link cannot turn the metadata assertion into a\n'
                  f'{indent}// competing Direct lifecycle transition.\n'
                  f'{indent}let mut scheduler_targets = Vec::with_capacity(requested_level);\n'
                  f'{indent}let mut scheduler_sinks = Vec::with_capacity(requested_level);\n'
                  f'{indent}for _ in 0..requested_level {{\n'
                  f'{indent}    let sink = UdpSocket::bind(SocketAddr::new(\n'
                  f'{indent}        IpAddr::V4(Ipv4Addr::LOCALHOST),\n'
                  f'{indent}        0,\n'
                  f'{indent}    ))\n'
                  f'{indent}    .await\n'
                  f'{indent}    .expect("bind isolated Birthday scheduler sink");\n'
                  f'{indent}    scheduler_targets.push(\n'
                  f'{indent}        sink.local_addr()\n'
                  f'{indent}            .expect("isolated Birthday scheduler sink has an endpoint"),\n'
                  f'{indent}    );\n'
                  f'{indent}    scheduler_sinks.push(sink);\n'
                  f'{indent}}}\n'
              )
              text = text[:scheduler_start] + block + text[scheduler_start:]

              scheduler_call = text.index(
                  'punch_hard_hard_birthday_candidates_with_metadata(', scheduler_start
              )
              scheduler_end = text.index('let scheduler_birthday =', scheduler_call)
              call_slice = text[scheduler_call:scheduler_end]
              old = 'result.candidate_endpoints.clone(),'
              if call_slice.count(old) != 1:
                  raise SystemExit(
                      f'expected one candidate target in first scheduler call, found {call_slice.count(old)}'
                  )
              call_slice = call_slice.replace(old, 'scheduler_targets,', 1)
              text = text[:scheduler_call] + call_slice + text[scheduler_end:]
              path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "client/daemon/src/lib/tests/part07.rs"
          git diff -- client/daemon/src/lib/tests/part07.rs
      - name: Commit generated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'source already patched'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/daemon/src/lib/tests/part07.rs
          git commit -m 'feat:隔离Hard-Hard生日调度测试目标'
          git push origin HEAD:tmp/hard-hard-fixture-patch-20260905
