name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter-android:
    name: Flutter Android arm64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: apps/flutter_client
        run: flutter pub get

      - name: Build Android arm64 release APK
        working-directory: apps/flutter_client
        run: >
          flutter build apk
          --release
          --target-platform android-arm64
          --split-debug-info build/symbols/android-arm64

      - name: Assemble Android release artifact
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp apps/flutter_client/build/app/outputs/flutter-apk/app-release.apk \
            dist-release/p2wlan-flutter-android-arm64-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-android-arm64-release
          path: dist-release/p2wlan-flutter-android-arm64-release.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/p2wlan-flutter-android-arm64-release.apk

  flutter-ios:
    name: Flutter iOS arm64 IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: apps/flutter_client
        run: flutter pub get

      - name: Build unsigned iOS release app
        working-directory: apps/flutter_client
        run: >
          flutter build ios
          --release
          --no-codesign
          --split-debug-info build/symbols/ios-arm64

      - name: Assemble unsigned iOS IPA
        run: |
          set -euo pipefail
          app="apps/flutter_client/build/ios/iphoneos/Runner.app"
          payload="$RUNNER_TEMP/p2wlan-ios-payload"
          rm -rf "$payload"
          mkdir -p "$payload/Payload" dist-release
          ditto "$app" "$payload/Payload/P2WLAN.app"
          (cd "$payload" && zip -qry "$GITHUB_WORKSPACE/dist-release/p2wlan-flutter-ios-arm64-unsigned.ipa" Payload)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-ios-arm64-unsigned
          path: dist-release/p2wlan-flutter-ios-arm64-unsigned.ipa

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/p2wlan-flutter-ios-arm64-unsigned.ipa

  flutter-macos:
    name: Flutter macOS ${{ matrix.arch }} DMG
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            lipo_arch: arm64
          - arch: x64
            lipo_arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        working-directory: apps/flutter_client
        run: flutter config --enable-macos-desktop

      - name: Flutter pub get
        working-directory: apps/flutter_client
        run: flutter pub get

      - name: Build macOS release app
        working-directory: apps/flutter_client
        run: >
          flutter build macos
          --release
          --split-debug-info build/symbols/macos

      - name: Create architecture-specific DMG
        run: |
          set -euo pipefail
          src="apps/flutter_client/build/macos/Build/Products/Release/P2WLAN.app"
          work="$RUNNER_TEMP/p2wlan-flutter-macos-${{ matrix.arch }}"
          app="$work/P2WLAN.app"
          mkdir -p dist-release
          rm -rf "$work"
          mkdir -p "$work"
          ditto "$src" "$app"
          for binary in \
            "$app/Contents/MacOS/P2WLAN" \
            "$app/Contents/Frameworks/App.framework/Versions/A/App" \
            "$app/Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS"; do
            lipo "$binary" -thin "${{ matrix.lipo_arch }}" -output "$binary.thin"
            mv "$binary.thin" "$binary"
          done
          codesign --force --deep --sign - "$app"
          hdiutil create \
            -volname "P2WLAN" \
            -srcfolder "$app" \
            -ov \
            -format UDZO \
            "dist-release/p2wlan-flutter-macos-${{ matrix.arch }}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-macos-${{ matrix.arch }}
          path: dist-release/p2wlan-flutter-macos-${{ matrix.arch }}.dmg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/p2wlan-flutter-macos-${{ matrix.arch }}.dmg

  flutter-linux:
    name: Flutter Linux ${{ matrix.arch }} Bundle
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            target_platform: linux-x64
          # Flutter stable is not currently resolved by subosito/flutter-action
          # for GitHub-hosted Linux ARM64 runners. Linux ARM64 is still shipped
          # below as the CLI/daemon package.
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        working-directory: apps/flutter_client
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        working-directory: apps/flutter_client
        run: flutter pub get

      - name: Build Linux release bundle
        working-directory: apps/flutter_client
        run: >
          flutter build linux
          --release
          --target-platform ${{ matrix.target_platform }}
          --split-debug-info build/symbols/linux-${{ matrix.arch }}

      - name: Assemble Linux Flutter artifact
        run: |
          set -euo pipefail
          mkdir -p dist-release
          bundle_dir="apps/flutter_client/build/linux/${{ matrix.arch }}/release/bundle"
          if [ ! -d "$bundle_dir" ]; then
            bundle_dir="$(find apps/flutter_client/build/linux -path '*/release/bundle' -type d | head -n 1)"
          fi
          if [ -z "$bundle_dir" ] || [ ! -d "$bundle_dir" ]; then
            echo "Linux Flutter release bundle was not found." >&2
            exit 1
          fi
          tar -C "$bundle_dir" -czf "dist-release/p2wlan-flutter-linux-${{ matrix.arch }}.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-linux-${{ matrix.arch }}
          path: dist-release/p2wlan-flutter-linux-${{ matrix.arch }}.tar.gz

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/p2wlan-flutter-linux-${{ matrix.arch }}.tar.gz

  flutter-windows:
    name: Flutter Windows ${{ matrix.arch }} Installer
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          # Flutter stable is not currently resolved by subosito/flutter-action
          # for GitHub-hosted Windows ARM64 runners.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        working-directory: apps/flutter_client
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        working-directory: apps/flutter_client
        run: flutter pub get

      - name: Build Windows release bundle
        working-directory: apps/flutter_client
        run: >
          flutter build windows
          --release
          --split-debug-info build/symbols/windows-${{ matrix.arch }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        env:
          P2WLAN_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "dist-release" | Out-Null
          $releaseDir = Get-ChildItem -Path "apps\flutter_client\build\windows" -Directory -Recurse |
            Where-Object { $_.FullName -match "\\runner\\Release$" } |
            Select-Object -First 1
          if (-not $releaseDir) {
            throw "Windows Flutter release directory was not found."
          }
          $versionLine = Select-String -Path "apps\flutter_client\pubspec.yaml" -Pattern "^version:\s*(.+)$"
          $version = $versionLine.Matches[0].Groups[1].Value.Split("+")[0]
          $isccCandidates = @()
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          foreach ($base in @($programFilesX86, $env:ProgramFiles)) {
            if ($base) {
              $isccCandidates += (Join-Path $base "Inno Setup 6\ISCC.exe")
            }
          }
          if ($env:ChocolateyInstall) {
            $isccCandidates += (Join-Path $env:ChocolateyInstall "lib\innosetup\tools\ISCC.exe")
          }
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }
          $sourceDir = $releaseDir.FullName
          $outputDir = (Resolve-Path "dist-release").Path
          $iss = Join-Path $env:RUNNER_TEMP "p2wlan-flutter-windows.iss"
          @"
          #define SourceDir "$sourceDir"
          #define OutputDir "$outputDir"
          #define AppVersion "$version"
          #define AppArch "$env:P2WLAN_ARCH"

          [Setup]
          AppId={{D2C22E34-410C-4273-B888-0E689638C994}
          AppName=P2WLAN
          AppVersion={#AppVersion}
          AppPublisher=P2WLAN
          DefaultDirName={localappdata}\Programs\P2WLAN
          DefaultGroupName=P2WLAN
          DisableProgramGroupPage=yes
          OutputDir={#OutputDir}
          OutputBaseFilename=p2wlan-flutter-windows-{#AppArch}-setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=lowest
          UninstallDisplayIcon={app}\p2wlan_flutter_client.exe

          [Files]
          Source: "{#SourceDir}\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\P2WLAN"; Filename: "{app}\p2wlan_flutter_client.exe"
          Name: "{autodesktop}\P2WLAN"; Filename: "{app}\p2wlan_flutter_client.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked

          [Run]
          Filename: "{app}\p2wlan_flutter_client.exe"; Description: "Launch P2WLAN"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Path $iss -Encoding UTF8
          & $iscc $iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-flutter-windows-${{ matrix.arch }}-setup
          path: dist-release/p2wlan-flutter-windows-${{ matrix.arch }}-setup.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/p2wlan-flutter-windows-${{ matrix.arch }}-setup.exe

  linux-cli:
    name: Linux ${{ matrix.arch }} CLI Package
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-unknown-linux-gnu
            cross_packages: ""
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            cross_packages: gcc-aarch64-linux-gnu
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross compiler
        if: matrix.cross_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_packages }}

      - name: Build Linux CLI and daemon
        run: cargo build -p p2wlan-cli -p p2wlan-daemon --release --target ${{ matrix.target }}

      - name: Assemble Linux CLI tarball
        run: |
          set -euo pipefail
          name="p2wlan-linux-${{ matrix.arch }}-cli"
          pkg="dist-release/$name"
          mkdir -p "$pkg"
          cp target/${{ matrix.target }}/release/p2wlan "$pkg/"
          cp target/${{ matrix.target }}/release/p2wlan-daemon "$pkg/"
          cp scripts/install-linux-cli.sh "$pkg/install.sh"
          cp LICENSE "$pkg/"
          cat > "$pkg/README-LINUX-CLI.txt" <<'EOF'
          p2wlan Linux CLI Preview

          Contents:
          - p2wlan: user-facing command-line client
          - p2wlan-daemon: background daemon with real Linux TUN support
          - install.sh: system-wide installer; also works as an online GitHub release installer
          - LICENSE

          Install from this tarball:
          1. sudo ./install.sh

          Online install latest:
          1. curl -fsSL https://raw.githubusercontent.com/yhan-sun/p2wlan/main/scripts/install-linux-cli.sh -o /tmp/p2wlan-install.sh
          2. sudo sh /tmp/p2wlan-install.sh

          Online install a specific tag:
          1. curl -fsSL https://raw.githubusercontent.com/yhan-sun/p2wlan/main/scripts/install-linux-cli.sh -o /tmp/p2wlan-install.sh
          2. sudo sh /tmp/p2wlan-install.sh --version ${{ github.ref_name }}

          Preview or install to a user directory:
          - sh /tmp/p2wlan-install.sh --version ${{ github.ref_name }} --dry-run
          - sh /tmp/p2wlan-install.sh --install-dir "$HOME/.local/bin"

          Verify:
          - p2wlan --version
          - p2wlan help

          Quick start:
          - p2wlan login -u you@example.com
          - p2wlan up
          - p2wlan status

          Common commands:
          - p2wlan config show
          - p2wlan config set device-name linux-server
          - p2wlan config set udp-bind 0.0.0.0:60207
          - p2wlan config set udp-advertise <public-ip>:60207
          - p2wlan doctor
          - p2wlan update
          - p2wlan logs -f
          - p2wlan down
          - p2wlan help

          Notes:
          - `p2wlan up` requests sudo only when creating TUN and routes.
          - Login and configuration commands must be run without sudo.
          - Supplying `-p` is supported for automation, but interactive password input is safer.
          - Cloud direct UDP needs an open fixed UDP port in the provider security group and OS firewall.
          - `p2wlan doctor` shows peer UDP candidate previews and warns when peers only advertise private endpoints.
          - For self-hosting, run the Go control and relay services separately.
          EOF
          chmod +x "$pkg/p2wlan" "$pkg/p2wlan-daemon" "$pkg/install.sh"
          tar -C dist-release -czf "dist-release/$name.tar.gz" "$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2wlan-linux-${{ matrix.arch }}-cli
          path: dist-release/p2wlan-linux-${{ matrix.arch }}-cli.tar.gz

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/p2wlan-linux-${{ matrix.arch }}-cli.tar.gz
