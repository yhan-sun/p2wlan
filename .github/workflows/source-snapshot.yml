name: Source Snapshot

on:
  push:
    branches:
      - ops/source-snapshot-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude='apps/flutter_client/build' \
            --exclude='**/.dart_tool' \
            --exclude='**/.gradle' \
            -czf p2wlan-source.tar.gz .
          sha256sum p2wlan-source.tar.gz > p2wlan-source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: p2wlan-source-${{ github.sha }}
          path: |
            p2wlan-source.tar.gz
            p2wlan-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
