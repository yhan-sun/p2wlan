name: Apply Path State Machine Patch

on:
  push:
    branches:
      - refactor/explicit-path-state-machine-20260828
    paths:
      - ".github/workflows/apply-path-state-machine-patch.yml"

permissions:
  contents: write

concurrency:
  group: apply-path-state-machine-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/explicit-path-state-machine-20260828
          fetch-depth: 0
      - name: Apply exact integration patch
        run: python3 scripts/dev/apply_path_state_machine_patch.py
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and validate focused tests
        run: |
          cargo fmt --all
          cargo test -p p2wlan-daemon --lib path_state_machine_tests -- --test-threads=1
          git diff --check
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/dev/apply_path_state_machine_patch.py
          rm .github/workflows/apply-path-state-machine-patch.yml
          rmdir scripts/dev 2>/dev/null || true
      - name: Commit integrated state machine
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor(peer): make path transitions generation-aware"
          git push origin HEAD:refactor/explicit-path-state-machine-20260828
