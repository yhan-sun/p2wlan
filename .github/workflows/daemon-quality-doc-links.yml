name: Daemon quality documentation

on:
  push:
    branches: [automation/daemon-quality-workbench]
    paths: [.github/workbench/run-doc-links.json]

permissions:
  contents: read

concurrency:
  group: daemon-quality-documentation
  cancel-in-progress: false

env:
  SOURCE_BASE: 48654b20f78adb5d7b90d12aed734a5bfaf05b20
  TARGET_BRANCH: refactor/daemon-quality-hardening
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  documentation:
    if: github.repository == 'yhan-sun/p2wlan'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: workbench
          sparse-checkout: .github/workbench
          persist-credentials: false
      - name: Apply exact documentation-only source edits and CI gate
        run: python3 workbench/.github/workbench/apply_doc_links.py candidate
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Check source policy and formatting
        working-directory: candidate
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/docs/verify_repository.py
          python3 scripts/quality/check_code_health.py --base-ref "$SOURCE_BASE"
          cargo fmt --all --check
      - name: Strict Rust API documentation
        working-directory: candidate
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --locked -p p2wlan-daemon --lib --no-deps --all-features
      - name: Publish documentation follow-up without rewriting tested history
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_BRANCH" = refactor/daemon-quality-hardening
          test "$(git rev-parse HEAD)" = "$SOURCE_BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/daemon/src/control.rs client/daemon/src/peer/connection/core.rs client/daemon/src/relay/transport.rs client/daemon/src/config/types.rs .github/workflows/ci.yml
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 5
          git diff --cached --check
          git commit -m 'feat:修复Rust API文档链接并加入严格文档门禁'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git show --stat --oneline HEAD
