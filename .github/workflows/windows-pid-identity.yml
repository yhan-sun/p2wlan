name: Windows PID Identity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-pid-identity.yml"
      - "apps/flutter_client/lib/core/daemon/**"
      - "apps/flutter_client/test/windows_pid_identity_test.dart"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-pid-identity.yml"
      - "apps/flutter_client/lib/core/daemon/**"
      - "apps/flutter_client/test/windows_pid_identity_test.dart"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-pid-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-pid-identity:
    name: Windows PID identity regression
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout identity
        shell: bash
        env:
          P2WLAN_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$P2WLAN_EXACT_HEAD" =~ ^[0-9a-fA-F]{40}$ ]]
          actual_head_sha="$(git rev-parse HEAD)"
          test "$actual_head_sha" = "$P2WLAN_EXACT_HEAD"
          echo "source_head_sha=$actual_head_sha"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Flutter dependencies
        working-directory: apps/flutter_client
        run: flutter pub get

      - name: Run Windows PID identity regression
        working-directory: apps/flutter_client
        run: flutter test test/windows_pid_identity_test.dart
