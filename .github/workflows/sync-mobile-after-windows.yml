name: Sync Mobile Task After Windows

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: sync-mobile-after-windows-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.head_ref == 'test/mobile-lifecycle-regression-20260828'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Wait for accepted Windows marker on main
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 300); do
            if gh api "repos/$REPO/contents/.github/workflows/windows-lifecycle-required.yml?ref=main" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Check out mobile candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Merge current main without conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "candidate already contains current main"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit origin/main
          git push origin "HEAD:${{ github.head_ref }}"
