name: Path Observability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/path-observability-required.yml"
      - "client/daemon/**"
      - "client/tun/**"
      - "client/cli/**"
      - "apps/flutter_client/**"
      - "contracts/**"
      - "docs/reference/path-observability.md"
      - "scripts/path-observability-evidence.py"
      - "server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # Close same-head network/CI prerequisites; regression checks read the dependency graph.
      - ".github/workflows/**"
      - "client/netbind/**"
      - "client/wireguard/**"
      - "client/relay/**"
      - "scripts/dplpmtud/**"
      - "docs/reference/networking.md"
      - "scripts/mtu-smoke.sh"
      - "scripts/quality/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/path-observability-required.yml"
      - "client/daemon/**"
      - "client/tun/**"
      - "client/cli/**"
      - "apps/flutter_client/**"
      - "contracts/**"
      - "docs/reference/path-observability.md"
      - "scripts/path-observability-evidence.py"
      - "server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # Close same-head network/CI prerequisites; regression checks read the dependency graph.
      - ".github/workflows/**"
      - "client/netbind/**"
      - "client/wireguard/**"
      - "client/relay/**"
      - "scripts/dplpmtud/**"
      - "docs/reference/networking.md"
      - "scripts/mtu-smoke.sh"
      - "scripts/quality/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A commit validation (push / pull_request) and a periodic health check
  # (schedule / workflow_dispatch) are different obligations for the same
  # ref. Sharing one concurrency group let a scheduled run cancel an
  # in-flight commit validation, so each event class gets its own group and
  # only a pull request cancels its own superseded predecessors.
  group: path-observability-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  P2WLAN_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  linux:
    name: Path observability Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.P2WLAN_EXACT_HEAD }}
      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$P2WLAN_EXACT_HEAD"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Install Linux workspace dependencies
        timeout-minutes: 15
        run: |
          # Use the official archive for mirrorlist and legacy direct-URI images.
          sudo sed -E -i \
            -e 's|mirror\+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            xdotool \
            patchelf
      - name: Rust format and clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Typed path observability regressions
        run: cargo test -p p2wlan-daemon --lib path_observability -- --test-threads=1
      - name: Rust status contract
        run: cargo test -p p2wlan-daemon --test contract_fixture -- --test-threads=1
      - name: Generate structured evidence
        env:
          P2WLAN_PATH_OBSERVABILITY_EVIDENCE: ${{ runner.temp }}/path-observability-evidence.json
        run: python3 scripts/path-observability-evidence.py
      - name: Upload structured evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: path-observability-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/path-observability-evidence.json
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Path observability Windows checks
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.P2WLAN_EXACT_HEAD }}
      - name: Verify exact head
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:P2WLAN_EXACT_HEAD) {
            throw "exact head mismatch"
          }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Windows format and compile
        run: |
          cargo fmt --all -- --check
          cargo clippy -p p2wlan-daemon -p p2wlan-cli --all-targets --all-features -- -D warnings
      - name: Windows typed regressions
        run: cargo test -p p2wlan-daemon --lib path_observability -- --test-threads=1
      - name: Windows status contract
        run: cargo test -p p2wlan-daemon --test contract_fixture -- --test-threads=1

  clients:
    name: Flutter CLI and Go contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.P2WLAN_EXACT_HEAD }}
      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$P2WLAN_EXACT_HEAD"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Flutter contract
        working-directory: apps/flutter_client
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed \
            lib/core/models/diagnostics_models.dart \
            lib/core/models/diagnostics_models/peer.dart \
            lib/core/models/diagnostics_models/snapshot.dart \
            lib/core/models/diagnostics_models/path_observability.dart \
            test/contract_test.dart
          flutter analyze
          flutter test test/contract_test.dart
      - name: Go contracts
        working-directory: server
        run: |
          go vet ./...
          go test ./... -count=1

  required:
    name: Path Observability Required
    if: always()
    needs: [linux, windows, clients]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce path observability gates
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.linux.result }}" = "success"
          test "${{ needs.windows.result }}" = "success"
          test "${{ needs.clients.result }}" = "success"
          echo "Path Observability Required passed for ${{ env.P2WLAN_EXACT_HEAD }}"
