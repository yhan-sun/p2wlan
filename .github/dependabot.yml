version: 2
# Dependency PRs are a standing background load, not a work queue. The policy
# keeps normal update noise bounded; security updates are controlled by the
# repository's Dependabot security settings, not by this file.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
    groups:
      cargo-compatible:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "x25519-dalek"
          - "curve25519-dalek"
          - "ed25519-dalek"
          - "chacha20poly1305"
          - "blake2"
          - "sha2"
          - "zeroize"
          - "subtle"
          - "rand"
          - "rand_core"
          - "rcgen"
          - "rustls*"
          - "ring"
          - "webpki*"
          - "tracing"
          - "tracing-subscriber"
          - "tracing-core"
          - "socket2"
          - "hex"
          - "libc"
          - "if-addrs"
          - "nix"
          - "mio"

  - package-ecosystem: gomod
    directory: "/server"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
    groups:
      gomod-compatible:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "golang.org/x/crypto"
          - "golang.org/x/sys"
          - "golang.org/x/net"
          - "golang.org/x/text"
          - "github.com/golang-jwt/jwt/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
