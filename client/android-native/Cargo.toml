[package]
name = "p2wlan-android-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JNI bridge for the P2WLAN Android VPN service"

[lib]
name = "p2wlan_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
p2wlan-daemon = { path = "../daemon", version = "0.1.147" }
p2pnet-tun = { path = "../tun", version = "0.1.147" }
p2pnet-netbind = { path = "../netbind", version = "0.1.147" }
jni = "0.21"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
