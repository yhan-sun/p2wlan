[package]
name = "p2pnet-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DERP-like relay server and client for P2PNet"

[dependencies]
p2pnet-netbind = { path = "../netbind", version = "1.0.1" }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
ed25519-dalek = { version = "3", features = ["alloc", "pkcs8"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
bytes = { workspace = true }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }

[dev-dependencies]
tokio = { workspace = true }
rcgen = "0.14"
